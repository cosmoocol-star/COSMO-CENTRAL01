<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2EAF4">
<title>👥 COSMO — Equipo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F2EAF4; --surface:rgba(255,255,255,0.86); --surface2:rgba(120,80,130,0.22);
  --accent:#7c3aed; --accent2:#A872AD;
  --teal:#0e7490; --blue:#6D3F79;
  --gold:#b45309; --green:#15803d; --red:#dc2626;
  --text:#2A1F30; --muted:#6B5A73; --muted2:#9C8BA3;
  --border:rgba(90,60,100,0.10); --border2:rgba(90,60,100,0.16);
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 28px;background:rgba(248,242,250,0.92);border-bottom:1px solid rgba(168,114,173,0.30);backdrop-filter:blur(12px);flex-wrap:wrap;gap:8px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:4px;background:linear-gradient(90deg,var(--blue),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#9ca3af;flex-shrink:0;cursor:pointer;margin-left:8px;box-shadow:0 0 0 3px rgba(156,163,175,0.16);transition:background .3s,box-shadow .3s;display:inline-block;}
.sync-dot.ok{background:#15803d;box-shadow:0 0 0 3px rgba(21,128,61,0.15);}
.sync-dot.run{background:#b45309;box-shadow:0 0 0 3px rgba(180,83,9,0.18);animation:syncPulseEq 1s ease-in-out infinite;}
.sync-dot.off{background:#9ca3af;}
.sync-dot.err{background:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,0.15);}
@keyframes syncPulseEq{0%,100%{transform:scale(1);}50%{transform:scale(1.35);}}
#app{max-width:820px;margin:0 auto;padding:24px 20px 60px;}
.page-title{margin-bottom:16px;}
.page-title h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;background:linear-gradient(90deg,var(--blue),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-title p{font-size:11px;color:var(--muted);margin-top:2px;}
.tabs{display:flex;gap:0;margin-bottom:18px;border-bottom:1px solid rgba(168,114,173,0.30);overflow-x:auto;}
.tab-btn{padding:9px 16px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:11px;letter-spacing:1.5px;cursor:pointer;font-family:'Bebas Neue',sans-serif;white-space:nowrap;}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.vista{display:none;}
.vista.active{display:block;}
.tc{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:14px;}
.tc-top{display:flex;align-items:center;gap:10px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2A1F30;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;z-index:9999;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.25);}
input,textarea{font-family:inherit;}

/* ── Mascota del header ────────────────────────────────────────────────────
   Misma familia visual que Cosmo Pedidos: la mascota a la izquierda, el
   nombre al lado. Cada app lleva el personaje del valor COSMO que le
   corresponde, así se reconocen entre sí de un vistazo. */
.logo-wrap{display:flex;align-items:center;gap:11px;}
.logo-mascota{height:58px;width:auto;flex-shrink:0;filter:drop-shadow(0 2px 5px rgba(90,60,100,0.18));transition:transform .45s cubic-bezier(.34,1.56,.64,1);}
.logo-wrap:hover .logo-mascota{transform:rotate(-8deg) scale(1.07);}
.logo-valor{font-size:7px;letter-spacing:1.5px;text-transform:uppercase;opacity:.45;margin-top:1px;}
@media(max-width:600px){ .logo-mascota{height:44px;} .logo-wrap{gap:8px;} }

/* ── Pestañas en la franja superior ────────────────────────────────────────
   El título "EQUIPO" repetía lo que ya dice el header, así que se quitó y las
   pestañas subieron. En el header se elimina la línea inferior de la barra
   (el propio borde del header ya la hace) para que no se vean dos rayas. */
.header-actions{display:flex;align-items:center;gap:10px;min-width:0;}
header .tabs{margin-bottom:0;border-bottom:none;max-width:100%;scrollbar-width:none;}
header .tabs::-webkit-scrollbar{display:none;}
header .tab-btn{padding:7px 13px;}
@media(max-width:760px){
  header{padding:8px 14px;}
  .header-actions{width:100%;}
  header .tab-btn{padding:6px 10px;font-size:10px;}
}

/* ── Balance del header ────────────────────────────────────────────────────
   El bloque del logo quedaba pegado al borde izquierdo y las pestañas al
   derecho, con un vacío grande en medio. Se acercan al centro dejando un
   respiro fijo entre los dos, en vez de empujarlos a los extremos. */
header{ justify-content:center !important; gap:34px; }
header .logo-wrap{ margin-right:0; }
@media(max-width:900px){ header{ justify-content:space-between !important; gap:14px; } }
</style>
</head>

<script>
// ══════════════════════════════════════
// UTILS
// ══════════════════════════════════════
function safeParse(raw, fb){ if(raw==null) return fb; try{ var v = JSON.parse(raw); return v==null ? fb : v; }catch(e){ return fb; } }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, ms){
  var t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.style.display = 'none'; }, ms||2400);
}

function switchVista(id){
  ['team','taller','ruta','inversiones'].forEach(function(v){
    document.getElementById('vista-'+v).classList.toggle('active', v===id);
    document.getElementById('tab-'+v).classList.toggle('active', v===id);
  });
  // Taller lee datos que pudieron cambiar en otra pestaña o desde el Hub —
  // se refresca al entrar, no solo cuando se toca algo dentro de él.
  if(id==='taller' && typeof window._tallerRender==='function') window._tallerRender();
  // Por si el mouse quedó sobre un nodo de Inversiones justo al cambiar de
  // pestaña (el mouseleave no siempre alcanza a dispararse a tiempo).
  if(id!=='inversiones' && typeof window._invTipOcultar==='function') window._invTipOcultar();
}

// ══════════════════════════════════════
// RUTA ANUAL — mapa de metas del año, con etapas y enlace a Misiones del Hub
// ══════════════════════════════════════
function initRuta(){
  var el=document.getElementById('ruta-root'); if(!el) return;

  var ESTADOS=['Por iniciar','En progreso','Completado','Pausado'];
  var ESTADO_COLOR={'Por iniciar':'#6B5A73','En progreso':'#06d6c8','Completado':'#15803d','Pausado':'#f59e0b'};
  var ESTADO_BG={'Por iniciar':'rgba(51,65,85,0.2)','En progreso':'rgba(6,214,200,0.12)','Completado':'rgba(60,252,160,0.12)','Pausado':'rgba(245,158,11,0.12)'};
  var PRIORIDADES=['Alta','Media','Estratégico'];
  var PRIORIDAD_COLOR={'Alta':'#f5c842','Media':'#06d6c8','Estratégico':'#a855f7'};

  var DEFAULT_METAS=[
    {id:1,icon:'🤝',titulo:'Modelo de Expansión Colombia',desc:'Marcas aliadas, distribuidores oficiales y Marcas N1/N2/N3. Base del crecimiento estructurado.',prioridad:'Alta',estado:'En progreso',requiere:[],etapas:[]},
    {id:2,icon:'🛡️',titulo:'Registro de Marca & Legal',desc:'Protección legal antes de salir del país. Sin esto la expansión internacional es frágil.',prioridad:'Alta',estado:'Por iniciar',requiere:[],etapas:[]},
    {id:3,icon:'👥',titulo:'1° Integrante Tiempo Completo',desc:'Cuando la expansión y defensa estén más sólidas, será el momento de sumar al equipo.',prioridad:'Alta',estado:'Por iniciar',requiere:[],etapas:[]},
    {id:4,icon:'📦',titulo:'Ampliar Portafolio',desc:'Masas, bases toppers, cejas, pestañas, resina UV, linternas, moldes, kits inicio.',prioridad:'Media',estado:'Por iniciar',requiere:[],etapas:[]},
    {id:5,icon:'🌐',titulo:'Página Web Operativa',desc:'Canal propio de ventas y vitrina profesional para B2B e internacionalización.',prioridad:'Media',estado:'Por iniciar',requiere:[2],etapas:[]},
    {id:6,icon:'🛒',titulo:'Plataformas Digitales',desc:'Mercado Libre, Etsy, Amazon. Canales que amplifican sin estructura adicional.',prioridad:'Media',estado:'Por iniciar',requiere:[5],etapas:[]},
    {id:7,icon:'🌎',titulo:'Reforzar Presencia Internacional',desc:'Panamá, Venezuela, Ecuador — ya hay llegada. Consolidar, no solo estar.',prioridad:'Estratégico',estado:'Por iniciar',requiere:[1,2],etapas:[]},
    {id:8,icon:'🚀',titulo:'Replicar Modelo Nuevos Países',desc:'Brasil, Chile, Perú. Una vez el modelo esté documentado y probado en Colombia.',prioridad:'Estratégico',estado:'Por iniciar',requiere:[7],etapas:[]},
    {id:9,icon:'✨',titulo:'Identidad Visual & Catálogos',desc:'Actualización constante en WhatsApp, Instagram y web. La imagen vende antes que el precio.',prioridad:'Estratégico',estado:'En progreso',requiere:[],etapas:[]},
    {id:10,icon:'🏭',titulo:'Profesionalizar Espacios',desc:'Áreas de producción (despacho y resina) con estándares profesionales.',prioridad:'Estratégico',estado:'Por iniciar',requiere:[],etapas:[]},
  ];

  var metas = safeParse(localStorage.getItem('cosmo_metas2026'), null) || DEFAULT_METAS;
  metas.forEach(function(m){ if(!m.etapas) m.etapas=[]; });
  function save(){ metasSave(metas); }
  _diagMigrarAMisEtapaB2B(metas, save);

  var dragSrc=null;
  var editingIdx=null;
  var expandedIdx=null;

  function getMissions(){ return safeParse(localStorage.getItem('cosmo_missions'), []); }
  function saveMissions(ms){ missionsSave(ms); }

  function pushEtapaToMissions(meta, etapa){
    var ms = getMissions();
    if(ms.find(function(m){ return m.fromEtapa===etapa.eid; })) return;
    var newId = 'me_'+Date.now();
    ms.push({
      id: newId, fromEtapa: etapa.eid, title: meta.icon+' '+etapa.titulo,
      status: 'active', priority: meta.prioridad==='Alta'?'high':(meta.prioridad==='Media'?'med':'low'),
      due: '', owner: 'Diego', collapsed: false, categories: [], reward: '', tasks: []
    });
    saveMissions(ms);
  }
  function removeEtapaFromMissions(eid){
    var ms = getMissions();
    var i = ms.findIndex(function(m){ return m.fromEtapa===eid; });
    if(i===-1) return;
    if(ms[i].tasks && ms[i].tasks.length===0 && !ms[i].reward && !ms[i].due){
      ms.splice(i,1);
      saveMissions(ms);
    }
  }

  function isDesbloqueada(meta){
    if(!meta.requiere||meta.requiere.length===0) return true;
    return meta.requiere.every(function(rid){
      var dep=metas.find(function(m){return m.id===rid;});
      return dep&&(dep.estado==='En progreso'||dep.estado==='Completado');
    });
  }

  function renderEditPanel(idx){
    var m=metas[idx];
    var h='<div id="ruta-edit-panel" style="background:#fff;border:1px solid rgba(168,85,247,0.3);border-radius:14px;padding:16px;margin-bottom:14px;">';
    h+='<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">';
    h+='<div style="font-size:9px;text-transform:uppercase;letter-spacing:2px;color:#a855f7;">✏️ Editando: '+m.icon+' '+m.titulo+'</div>';
    h+='<button onclick="window._rutaCerrarEdit()" style="background:none;border:none;color:#6B5A73;cursor:pointer;font-size:14px;">✕</button>';
    h+='</div>';

    h+='<div style="display:grid;grid-template-columns:52px 1fr;gap:8px;margin-bottom:10px;">';
    h+='<div><div style="font-size:8px;color:#6B5A73;margin-bottom:3px;">Ícono</div>';
    h+='<input id="re-icon" value="'+esc(m.icon)+'" style="width:100%;background:#fff;border:1px solid rgba(90,60,100,0.14);border-radius:7px;padding:7px;color:#2A1F30;font-size:18px;text-align:center;outline:none;"></div>';
    h+='<div><div style="font-size:8px;color:#6B5A73;margin-bottom:3px;">Título</div>';
    h+='<input id="re-titulo" value="'+m.titulo.replace(/"/g,'&quot;')+'" style="width:100%;background:#fff;border:1px solid rgba(90,60,100,0.14);border-radius:7px;padding:7px 10px;color:#2A1F30;font-size:11px;outline:none;"></div></div>';

    h+='<div style="margin-bottom:10px;"><div style="font-size:8px;color:#6B5A73;margin-bottom:3px;">Descripción</div>';
    h+='<textarea id="re-desc" style="width:100%;background:#fff;border:1px solid rgba(90,60,100,0.14);border-radius:7px;padding:8px 10px;color:#6B5A73;font-size:10px;line-height:1.6;resize:none;outline:none;min-height:50px;box-sizing:border-box;font-family:inherit;">'+m.desc+'</textarea></div>';

    h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">';

  window._rutaDragEnd=function(){ dragSrc=null; render(); };
  window._rutaRender=render;

// ══════════════════════════════════════
// DIAGRAMA DE FRENTES — mapa libre de nodos y flechas por meta, para
// desglosar los frentes que abre una meta grande (ej. "Modelo de Expansión
// Colombia" → Marcas Aliadas, Distribuidores, Marcas N1/N2/N3...). Vive
// aparte de las Etapas — esas siguen para lo puntual y se conectan con
// Misiones del Hub; el diagrama es la vista de conjunto, libre: agregas
// nodos donde quieras y los conectas como quieras, no una jerarquía fija.
// ══════════════════════════════════════
// Migración de una sola vez: el mapa de la meta se movió a vivir dentro de
// cada etapa (ya no hay botón de diagrama en la tarjeta de la meta). Si ya
// existía un diagrama armado a nivel de meta (ej. "Modelo de Expansión
// Colombia"), se traslada a su etapa "...B2B..." en vez de perderlo.
function _diagMigrarAMisEtapaB2B(metas, save){
  var FLAG = 'cosmo_diag_migrado_b2b_v1';
  if(localStorage.getItem(FLAG)) return;
  localStorage.setItem(FLAG, '1');
  var cambio = false;
  (metas||[]).forEach(function(meta){
    if(!meta.diagrama || !meta.diagrama.nodos || !meta.diagrama.nodos.length) return;
    var etapaB2B = (meta.etapas||[]).find(function(e){ return /b2b/i.test(e.titulo||''); });
    if(!etapaB2B) return;
    if(etapaB2B.diagrama && etapaB2B.diagrama.nodos && etapaB2B.diagrama.nodos.length) return; // ya tiene el suyo, no se pisa
    etapaB2B.diagrama = meta.diagrama;
    meta.diagrama = {nodos:[], conexiones:[]};
    cambio = true;
  });
  if(cambio && typeof save==='function') save();
}

var DIAG_ESTADOS = ['Por iniciar','En progreso','Completado','Pausado'];
var DIAG_ESTADO_COLOR = {'Por iniciar':'#9C8BA3','En progreso':'#0e7490','Completado':'#15803d','Pausado':'#b45309'};
var DIAG_W = 1400, DIAG_H = 820; // tamaño virtual del lienzo — más aire para que no se amontone
var DIAG_NODE_W = 170; // ancho de tarjeta (para calcular huecos libres)

// Formas de nodo — para clasificar visualmente sin imponer un significado
// fijo (tú decides qué representa cada una: ej. rombo = decisión, hexágono =
// riesgo, óvalo = hito). Se ciclan tocando el ícono de forma en cada nodo.
var DIAG_FORMAS = ['rect','ovalo','rombo','hexagono'];
var DIAG_FORMA_LABEL = {rect:'Recuadro', ovalo:'Óvalo', rombo:'Rombo', hexagono:'Hexágono'};
var DIAG_FORMA_ICON = {rect:'▭', ovalo:'⬭', rombo:'◆', hexagono:'⬡'};
function _diagFormaCSS(forma){
  if(forma==='ovalo') return {clip:'', radiusTop:'28px', pad:'9px 16px'};
  if(forma==='rombo') return {clip:'polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%)', radiusTop:'0', pad:'20px 32px'};
  if(forma==='hexagono') return {clip:'polygon(22% 0%, 78% 0%, 100% 50%, 78% 100%, 22% 100%, 0% 50%)', radiusTop:'0', pad:'16px 28px'};
  return {clip:'', radiusTop:'12px', pad:'8px 10px'}; // rect
}

var _diagMetasCache = null;   // arreglo de metas cargado al abrir — única fuente mientras esté abierto
var _diagMetaId = null;
var _diagEtapaId = null;      // si tiene valor, el diagrama abierto es el de ESTA etapa dentro de la meta, no el de la meta
var _diagModo = 'mover';      // 'mover' | 'conectar'
var _diagConectarDesde = null;
var _diagDrag = null;         // {id, offX, offY}

// Devuelve el "dueño" del diagrama que está abierto — puede ser la meta
// completa, o una etapa puntual dentro de ella (ej. "Distribuidores
// Oficiales" dentro de "Modelo de Expansión Colombia"). El resto del
// módulo no necesita saber cuál de las dos es: ambas tienen .titulo y
// .diagrama, así que todo lo demás funciona igual sin cambios.
function _diagMetaActual(){
  if(!_diagMetasCache) return null;
  var meta = _diagMetasCache.find(function(m){ return m.id===_diagMetaId; });
  if(!meta) return null;
  if(!_diagEtapaId) return meta;
  return (meta.etapas||[]).find(function(e){ return e.eid===_diagEtapaId; }) || null;
}
function _diagGuardar(){ if(_diagMetasCache) metasSave(_diagMetasCache); }

window._diagramaAbrir = function(idx){
  var metas = (typeof window._rutaGetMetas==='function') ? window._rutaGetMetas() : safeParse(localStorage.getItem('cosmo_metas2026'), []);
  var meta = metas[idx];
  if(!meta) return;
  if(!meta.diagrama) meta.diagrama = {nodos:[], conexiones:[]};
  if(!meta.diagrama.nodos) meta.diagrama.nodos = [];
  if(!meta.diagrama.conexiones) meta.diagrama.conexiones = [];
  _diagMetasCache = metas;
  _diagMetaId = meta.id;
  _diagEtapaId = null;
  _diagModo = 'mover';
  _diagConectarDesde = null;
  _diagRender();
};

// Igual que arriba, pero para el diagrama propio de UNA etapa dentro de la
// meta — cada etapa (ej. "Distribuidores Oficiales") puede tener su propio
// plan/proceso, aparte del panorama general de la meta.
window._diagramaAbrirEtapa = function(metaIdx, etapaIdx){
  var metas = (typeof window._rutaGetMetas==='function') ? window._rutaGetMetas() : safeParse(localStorage.getItem('cosmo_metas2026'), []);
  var meta = metas[metaIdx]; if(!meta) return;
  var etapa = (meta.etapas||[])[etapaIdx]; if(!etapa) return;
  if(!etapa.diagrama) etapa.diagrama = {nodos:[], conexiones:[]};
  if(!etapa.diagrama.nodos) etapa.diagrama.nodos = [];
  if(!etapa.diagrama.conexiones) etapa.diagrama.conexiones = [];
  _diagMetasCache = metas;
  _diagMetaId = meta.id;
  _diagEtapaId = etapa.eid;
  _diagModo = 'mover';
  _diagConectarDesde = null;
  _diagRender();
};

window._diagramaCerrar = function(){
  var ov = document.getElementById('diagrama-overlay');
  if(ov && ov.parentNode) ov.parentNode.removeChild(ov);
  _diagMetasCache = null; _diagMetaId = null; _diagEtapaId = null; _diagDrag = null;
};

// ── Exportar el diagrama actual a PDF ────────────────────────────────────
// Reusa el mismo jsPDF que ya carga Cosmo_Pedidos.html (mismo CDN). Como el
// diagrama mezcla tarjetas HTML (con clip-path) y líneas SVG, se envuelve
// el lienzo tal cual está en pantalla dentro de un SVG con <foreignObject>,
// se rasteriza a un <canvas> y esa imagen es la que entra al PDF — así no
// hace falta ninguna librería aparte de captura de pantalla.
window._diagramaExportarPDF = function(){
  var meta = _diagMetaActual(); if(!meta) return;
  if(!meta.diagrama.nodos.length){
    alert('Agrega al menos un frente antes de descargar el diagrama.');
    return;
  }
  if(typeof window.jspdf === 'undefined'){
    var script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
    script.onload = function(){ _diagGenerarPDF(meta); };
    script.onerror = function(){ alert('Error cargando el generador de PDF. Verifica tu conexión.'); };
    document.head.appendChild(script);
  } else {
    _diagGenerarPDF(meta);
  }
};

function _diagGenerarPDF(meta){
  var lienzo = document.getElementById('diag-lienzo'); if(!lienzo) return;
  var w = DIAG_W, h = DIAG_H, escala = 2; // escala 2x para que se vea nítido en el PDF

  var svgFuente = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
    + '<foreignObject width="'+w+'" height="'+h+'">'
    + '<div xmlns="http://www.w3.org/1999/xhtml" style="width:'+w+'px;height:'+h+'px;background:#F2EAF4;font-family:DM Sans,Arial,sans-serif;">'
    + lienzo.innerHTML
    + '</div></foreignObject></svg>';

  var img = new Image();
  img.onload = function(){
    var canvas = document.createElement('canvas');
    canvas.width = w*escala; canvas.height = h*escala;
    var ctx = canvas.getContext('2d');
    ctx.fillStyle = '#F2EAF4'; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    var dataUrl;
    try{ dataUrl = canvas.toDataURL('image/png'); }
    catch(e){ alert('No se pudo generar la imagen del diagrama.'); return; }
    _diagArmarPDF(meta, dataUrl, w, h);
  };
  img.onerror = function(){ alert('No se pudo generar la imagen del diagrama.'); };
  img.src = 'data:image/svg+xml;charset=utf-8;base64,' + btoa(unescape(encodeURIComponent(svgFuente)));
}

function _diagArmarPDF(meta, dataUrl, w, h){
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  var pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();

  doc.setFont('helvetica','bold'); doc.setFontSize(15); doc.setTextColor(42,31,48);
  doc.text(_diagEtapaId ? 'Diagrama de la etapa' : 'Diagrama de frentes', 12, 16);
  doc.setFont('helvetica','normal'); doc.setFontSize(11); doc.setTextColor(107,90,115);
  doc.text(meta.titulo||'', 12, 23);

  var imgW = pageW-24, imgH = imgW*(h/w);
  if(imgH > pageH-40){ imgH = pageH-40; imgW = imgH*(w/h); }
  var x = (pageW-imgW)/2;
  doc.addImage(dataUrl, 'PNG', x, 28, imgW, imgH);

  doc.setFontSize(8); doc.setTextColor(156,139,163);
  doc.text('Generado el '+new Date().toLocaleDateString('es-CO'), 12, pageH-6);

  var nombreArchivo = 'Diagrama - '+(meta.titulo||'frentes').replace(/[\\/:*?"<>|]/g,'').trim()+'.pdf';
  doc.save(nombreArchivo);
}

window._diagModoSet = function(m){
  _diagModo = m; _diagConectarDesde = null;
  _diagRender();
};

window._diagNodoAgregar = function(){
  var meta = _diagMetaActual(); if(!meta) return;
  var texto = prompt('¿Cómo se llama este frente?');
  if(!texto || !texto.trim()) return;
  var libre = _diagBuscarHueco(meta.diagrama.nodos);
  meta.diagrama.nodos.push({
    id: 'dn_'+Date.now(),
    x: libre.x, y: libre.y,
    texto: texto.trim(), estado: 'Por iniciar', forma: 'rect'
  });
  _diagGuardar(); _diagRender();
};

// Busca un hueco libre en el lienzo para el nodo nuevo, en vez de una
// fórmula fija de rejilla — así no cae encima de algo que ya moviste.
function _diagBuscarHueco(nodos){
  var pasoX=200, pasoY=120, margen=40;
  for(var y=margen; y<DIAG_H-90; y+=pasoY){
    for(var x=margen; x<DIAG_W-DIAG_NODE_W-margen; x+=pasoX){
      var choca = (nodos||[]).some(function(n){
        return Math.abs(n.x-x) < DIAG_NODE_W-20 && Math.abs(n.y-y) < 80;
      });
      if(!choca) return {x:x, y:y};
    }
  }
  // Si ya está todo ocupado, lo pone debajo de todo lo demás.
  var maxY = (nodos||[]).reduce(function(m,n){ return Math.max(m, n.y); }, 0);
  return {x:margen, y:maxY+140};
}

window._diagNodoClick = function(nid){
  var meta = _diagMetaActual(); if(!meta) return;
  if(_diagModo === 'conectar'){
    if(!_diagConectarDesde){
      _diagConectarDesde = nid;
      _diagRender();
      return;
    }
    if(_diagConectarDesde !== nid){
      var yaExiste = meta.diagrama.conexiones.some(function(c){
        return (c.from===_diagConectarDesde && c.to===nid) || (c.from===nid && c.to===_diagConectarDesde);
      });
      if(!yaExiste){
        meta.diagrama.conexiones.push({from:_diagConectarDesde, to:nid});
        _diagGuardar();
      }
    }
    _diagConectarDesde = null;
    _diagRender();
  }
};

window._diagNodoCiclarEstado = function(nid, ev){
  if(ev) ev.stopPropagation();
  var meta = _diagMetaActual(); if(!meta) return;
  var nodo = meta.diagrama.nodos.find(function(n){ return n.id===nid; }); if(!nodo) return;
  var i = DIAG_ESTADOS.indexOf(nodo.estado);
  nodo.estado = DIAG_ESTADOS[(i+1)%DIAG_ESTADOS.length];
  _diagGuardar(); _diagRender();
};

window._diagNodoCiclarForma = function(nid, ev){
  if(ev) ev.stopPropagation();
  var meta = _diagMetaActual(); if(!meta) return;
  var nodo = meta.diagrama.nodos.find(function(n){ return n.id===nid; }); if(!nodo) return;
  var i = DIAG_FORMAS.indexOf(nodo.forma||'rect');
  nodo.forma = DIAG_FORMAS[(i+1)%DIAG_FORMAS.length];
  _diagGuardar(); _diagRender();
};

window._diagNodoRenombrar = function(nid, ev){
  if(ev) ev.stopPropagation();
  var meta = _diagMetaActual(); if(!meta) return;
  var nodo = meta.diagrama.nodos.find(function(n){ return n.id===nid; }); if(!nodo) return;
  var t = prompt('Nombre del frente', nodo.texto);
  if(t===null || !t.trim()) return;
  nodo.texto = t.trim();
  _diagGuardar(); _diagRender();
};

window._diagNodoBorrar = function(nid, ev){
  if(ev) ev.stopPropagation();
  var meta = _diagMetaActual(); if(!meta) return;
  if(!confirm('¿Quitar este frente del diagrama?')) return;
  meta.diagrama.nodos = meta.diagrama.nodos.filter(function(n){ return n.id!==nid; });
  meta.diagrama.conexiones = meta.diagrama.conexiones.filter(function(c){ return c.from!==nid && c.to!==nid; });
  _diagGuardar(); _diagRender();
};

window._diagConexionBorrar = function(i){
  var meta = _diagMetaActual(); if(!meta) return;
  meta.diagrama.conexiones.splice(i,1);
  _diagGuardar(); _diagRender();
};

// Borrar una conexión tocándola directo en el lienzo (marcador ✕ en su punto medio).
window._diagConexionBorrarPar = function(from, to, ev){
  if(ev) ev.stopPropagation();
  var meta = _diagMetaActual(); if(!meta) return;
  if(!confirm('¿Quitar esta conexión?')) return;
  var i = meta.diagrama.conexiones.findIndex(function(c){ return c.from===from && c.to===to; });
  if(i===-1) return;
  meta.diagrama.conexiones.splice(i,1);
  _diagGuardar(); _diagRender();
};

// ── Arrastrar nodos (pointer events: mismo código para mouse y táctil) ──
function _diagDragStart(ev, nid){
  if(_diagModo !== 'mover') return;
  ev.preventDefault();
  var meta = _diagMetaActual(); if(!meta) return;
  var nodo = meta.diagrama.nodos.find(function(n){ return n.id===nid; }); if(!nodo) return;
  var wrap = document.getElementById('diag-lienzo');
  var rect = wrap.getBoundingClientRect();
  var scaleX = rect.width>0 ? DIAG_W/rect.width : 1, scaleY = rect.height>0 ? DIAG_H/rect.height : 1;
  var px = (ev.clientX - rect.left)*scaleX, py = (ev.clientY - rect.top)*scaleY;
  _diagDrag = { id:nid, offX: px-nodo.x, offY: py-nodo.y, scaleX:scaleX, scaleY:scaleY, rect:rect };
  document.addEventListener('pointermove', _diagDragMove);
  document.addEventListener('pointerup', _diagDragEnd);
}
function _diagDragMove(ev){
  if(!_diagDrag) return;
  var meta = _diagMetaActual(); if(!meta) return;
  var nodo = meta.diagrama.nodos.find(function(n){ return n.id===_diagDrag.id; }); if(!nodo) return;
  var px = (ev.clientX - _diagDrag.rect.left)*_diagDrag.scaleX, py = (ev.clientY - _diagDrag.rect.top)*_diagDrag.scaleY;
  var nx = px - _diagDrag.offX, ny = py - _diagDrag.offY;
  if(isFinite(nx)) nodo.x = Math.max(0, Math.min(DIAG_W-170, nx));
  if(isFinite(ny)) nodo.y = Math.max(0, Math.min(DIAG_H-60, ny));
  // Antes esto reconstruía TODO el lienzo (todas las tarjetas + todas las
  // líneas) en cada milímetro de movimiento — se sentía lento con varios
  // nodos. Luego se limitó a redibujar solo las líneas, pero seguía
  // reconstruyendo el SVG completo (con TODAS las conexiones) en cada
  // cuadro. Ahora solo se tocan, por atributo directo, las conexiones que
  // de verdad tienen algo que ver con el nodo que se está moviendo — el
  // resto del SVG ni se toca.
  var elNodo = document.querySelector('.diag-nodo[data-id="'+nodo.id+'"]');
  if(elNodo){ elNodo.style.left = nodo.x+'px'; elNodo.style.top = nodo.y+'px'; }
  if(_diagRAF) return;
  var raf = window.requestAnimationFrame || function(fn){ return setTimeout(fn, 16); };
  var idArrastrado = _diagDrag.id;
  _diagRAF = raf(function(){
    _diagRAF = null;
    _diagActualizarLineasDe(_diagMetaActual(), idArrastrado);
  });
}
var _diagRAF = null;

// Misma geometría que usa _diagLineasSVG, aislada para poder reusarla aquí
// sin reconstruir el SVG entero.
function _diagConexionGeo(a, b){
  var x1=a.x+170, y1=a.y+30, x2=b.x, y2=b.y+30;
  if(b.x > a.x+170){ x1=a.x+170; x2=b.x; } else if(b.x+170 < a.x){ x1=a.x; x2=b.x+170; } else { x1=a.x+85; x2=b.x+85; }
  var curva = _diagCurva(x1,y1,x2,y2, _diagHashPar(a.id,b.id));
  return { x1:x1, y1:y1, x2:x2, y2:y2, curva:curva };
}

// Actualiza en el DOM, por atributo, solo las conexiones que tocan al nodo
// que se está arrastrando — nada de volver a montar HTML/SVG.
function _diagActualizarLineasDe(meta, nodoId){
  if(!meta || typeof document==='undefined' || !document) return;
  meta.diagrama.conexiones.forEach(function(c){
    if(c.from!==nodoId && c.to!==nodoId) return;
    var a = meta.diagrama.nodos.find(function(n){ return n.id===c.from; });
    var b = meta.diagrama.nodos.find(function(n){ return n.id===c.to; });
    if(!a || !b) return;
    var g = document.querySelector('g.diag-conexion[data-from="'+c.from+'"][data-to="'+c.to+'"]');
    if(!g) return;
    var geo = _diagConexionGeo(a,b);
    var d = 'M '+geo.x1+','+geo.y1+' Q '+geo.curva.cx+','+geo.curva.cy+' '+geo.x2+','+geo.y2;
    var paths = g.querySelectorAll('path');
    if(paths[0]) paths[0].setAttribute('d', d);
    if(paths[1]) paths[1].setAttribute('d', d);
    var circ = g.querySelector('circle'); if(circ){ circ.setAttribute('cx', geo.curva.pmx); circ.setAttribute('cy', geo.curva.pmy); }
    var txt = g.querySelector('text'); if(txt){ txt.setAttribute('x', geo.curva.pmx); txt.setAttribute('y', geo.curva.pmy+3); }
  });
}
function _diagActualizarSVG(meta){
  if(!meta || typeof document==='undefined' || !document) return;
  var lienzo = document.getElementById('diag-lienzo'); if(!lienzo) return;
  var viejo = lienzo.querySelector('svg'); if(!viejo) return;
  var temp = document.createElement('div');
  temp.innerHTML = _diagLineasSVG(meta);
  lienzo.replaceChild(temp.firstChild, viejo);
}
function _diagDragEnd(){
  document.removeEventListener('pointermove', _diagDragMove);
  document.removeEventListener('pointerup', _diagDragEnd);
  if(_diagDrag){
    _diagDrag=null;
    _diagGuardar();
    _diagRenderLienzo(); // al soltar sí se redibuja completo, para que quede 100% consistente
  }
}
window._diagDragStart = _diagDragStart;

function _diagNodoHTML(nodo, meta){
  var ec = DIAG_ESTADO_COLOR[nodo.estado]||'#9C8BA3';
  var seleccionado = _diagConectarDesde===nodo.id;
  var f = _diagFormaCSS(nodo.forma||'rect');
  var borde = seleccionado?'#7c3aed':'rgba(90,60,100,0.14)';
  var sombraSel = seleccionado ? '0 0 0 3px rgba(124,58,237,0.18),' : '';

  var h = '<div class="diag-nodo" data-id="'+nodo.id+'" onpointerdown="window._diagDragStart(event,\''+nodo.id+'\')" onclick="window._diagNodoClick(\''+nodo.id+'\')" ';
  h += 'style="position:absolute;left:'+nodo.x+'px;top:'+nodo.y+'px;width:170px;box-shadow:'+sombraSel+'0 4px 14px rgba(90,60,100,0.14);cursor:'+(_diagModo==='mover'?'grab':'pointer')+';touch-action:none;user-select:none;transition:box-shadow .15s;">';

  // Zona de FORMA: solo el título — aquí sí se aplica el recorte (rombo/hexágono/óvalo),
  // así el texto nunca choca con los botones de abajo, sin importar la forma o el largo.
  h += '<div style="background:#fff;border:1.5px solid '+borde+';border-bottom:none;';
  h += (f.clip ? 'clip-path:'+f.clip+';' : 'border-radius:'+f.radiusTop+' '+f.radiusTop+' 0 0;');
  h += 'padding:'+f.pad+';">';
  h += '<div style="display:flex;align-items:flex-start;gap:6px;">';
  h += '<span onclick="window._diagNodoCiclarEstado(\''+nodo.id+'\',event)" title="Toca para cambiar el estado" style="width:11px;height:11px;border-radius:50%;background:'+ec+';box-shadow:0 0 0 3px '+ec+'22;flex-shrink:0;margin-top:2px;cursor:pointer;"></span>';
  h += '<span style="font-size:11px;font-weight:700;color:#2A1F30;flex:1;overflow-wrap:break-word;word-break:break-word;white-space:normal;line-height:1.4;">'+esc(nodo.texto)+'</span>';
  h += '</div></div>';

  // Franja de abajo: SIEMPRE rectangular, nunca se recorta — estado (como pastilla) + botones.
  h += '<div style="background:'+ec+'0c;border:1.5px solid '+borde+';border-top:1px solid '+ec+'30;border-radius:0 0 9px 9px;padding:6px 9px;display:flex;align-items:center;justify-content:space-between;">';
  h += '<span style="font-size:7px;color:'+ec+';font-weight:700;text-transform:uppercase;letter-spacing:0.5px;">'+nodo.estado+'</span>';
  h += '<span class="diag-ctrl" style="display:flex;gap:7px;opacity:0.4;transition:opacity .15s;">';
  h += '<span onclick="window._diagNodoCiclarForma(\''+nodo.id+'\',event)" title="Toca para cambiar la forma ('+DIAG_FORMA_LABEL[nodo.forma||'rect']+')" style="cursor:pointer;font-size:9px;">'+DIAG_FORMA_ICON[nodo.forma||'rect']+'</span>';
  h += '<span onclick="window._diagNodoRenombrar(\''+nodo.id+'\',event)" style="cursor:pointer;font-size:9px;">✎</span>';
  h += '<span onclick="window._diagNodoBorrar(\''+nodo.id+'\',event)" style="cursor:pointer;font-size:9px;color:#c0392b;">✕</span>';
  h += '</span></div>';

  h += '</div>';
  return h;
}

// Punto de control para una curva suave entre dos nodos, en vez de una línea
// recta — se ve mucho más profesional y ayuda a que dos flechas entre las
// mismas zonas no queden exactamente encimadas. El lado de la curva se
// decide con un hash estable del par (mismo par → siempre la misma curva).
function _diagCurva(x1,y1,x2,y2, seed){
  var mx=(x1+x2)/2, my=(y1+y2)/2;
  var dx=x2-x1, dy=y2-y1;
  var len = Math.sqrt(dx*dx+dy*dy) || 1;
  var nx=-dy/len, ny=dx/len;
  var curv = Math.min(50, len*0.22);
  var signo = (seed%2===0) ? 1 : -1;
  var cx = mx+nx*curv*signo, cy = my+ny*curv*signo;
  // Punto medio real sobre la curva (t=0.5 de una bézier cuadrática), para
  // colocar ahí el marcador de borrar — no el punto medio de la recta.
  var pmx = (x1 + 2*cx + x2)/4, pmy = (y1 + 2*cy + y2)/4;
  return { cx:cx, cy:cy, pmx:pmx, pmy:pmy };
}
function _diagHashPar(a,b){
  var s=String(a)+'|'+String(b), h=0;
  for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0;
  return Math.abs(h);
}

function _diagLineasSVG(meta){
  // xmlns explícito a propósito: cuando se genera en pantalla, el navegador
  // reconoce <svg> automáticamente aunque no lo lleve. Pero al exportar a
  // PDF, este bloque termina metido dentro de un <div> con xmlns de HTML —
  // eso pisa el espacio de nombres por defecto y el navegador deja de ver
  // esto como SVG de verdad, así que las flechas no salían en el PDF. Con
  // el xmlns puesto aquí mismo, no depende de dónde termine insertado.
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+DIAG_W+'" height="'+DIAG_H+'" viewBox="0 0 '+DIAG_W+' '+DIAG_H+'" style="position:absolute;left:0;top:0;pointer-events:none;">';
  svg += '<defs><marker id="diagArrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#a855f7"/></marker></defs>';
  meta.diagrama.conexiones.forEach(function(c){
    var a = meta.diagrama.nodos.find(function(n){ return n.id===c.from; });
    var b = meta.diagrama.nodos.find(function(n){ return n.id===c.to; });
    if(!a || !b) return;
    var geo = _diagConexionGeo(a,b);
    var d = 'M '+geo.x1+','+geo.y1+' Q '+geo.curva.cx+','+geo.curva.cy+' '+geo.x2+','+geo.y2;
    // Agrupadas bajo un <g> marcado con el par origen→destino: así, al
    // arrastrar, se puede encontrar y actualizar SOLO esta conexión por
    // atributo (ver _diagActualizarLineasDe) sin tocar el resto del SVG.
    svg += '<g class="diag-conexion" data-from="'+c.from+'" data-to="'+c.to+'">';
    svg += '<path d="'+d+'" fill="none" stroke="#a855f7" stroke-width="2" marker-end="url(#diagArrow)" opacity="0.5" stroke-linecap="round"/>';
    // Zona invisible más ancha, fácil de tocar, para poder borrar la línea directo en el lienzo.
    svg += '<path d="'+d+'" fill="none" stroke="transparent" stroke-width="18" style="pointer-events:stroke;cursor:pointer;" onclick="window._diagConexionBorrarPar(\''+c.from+'\',\''+c.to+'\',event)"><title>Tocar para quitar esta conexión</title></path>';
    // Marcador ✕ en el punto medio REAL de la curva — atenuado hasta pasar el mouse.
    svg += '<g class="diag-conn-x" style="pointer-events:all;cursor:pointer;opacity:0.35;transition:opacity .15s;" onclick="window._diagConexionBorrarPar(\''+c.from+'\',\''+c.to+'\',event)">';
    svg += '<circle cx="'+geo.curva.pmx+'" cy="'+geo.curva.pmy+'" r="8" fill="#fff" stroke="#a855f7" stroke-width="1.5"/>';
    svg += '<text x="'+geo.curva.pmx+'" y="'+(geo.curva.pmy+3)+'" text-anchor="middle" font-size="10" fill="#c0392b" font-weight="700">✕</text>';
    svg += '</g>';
    svg += '</g>';
  });
  svg += '</svg>';
  return svg;
}

// INVERSIONES
// ══════════════════════════════════════
function initInversiones(){
  var el=document.getElementById('inversiones-root'); if(!el) return;
  var ESTADOS=['Planeada','En evaluación','Aprobada','Ejecutada','Pausada'];
  var COLORES={'Planeada':'#8b93a8','En evaluación':'#fbbf24','Aprobada':'#38bdf8','Ejecutada':'#34e07a','Pausada':'#f87171'};
  var data=safeParse(localStorage.getItem('cosmo_inversiones'), []);
  data.forEach(function(inv){ if(!inv.requiere) inv.requiere=[]; });
  function save(){ inversionesSave(data); }
  function fmtM(n){ if(!n) return '$0'; if(n>=1000000) return '$'+(n/1000000).toFixed(1)+'M'; if(n>=1000) return '$'+(n/1000).toFixed(0)+'k'; return '$'+n; }

  // Por ahora, solo estas 4 áreas para categorizar inversiones (subconjunto
  // de las 7 del Taller — se puede ampliar después sin tocar Taller).
  var INV_CATEGORIAS = ZONAS_TALLER.filter(function(z){
    return ['impresion','corte','despacho','resina'].indexOf(z.id)!==-1;
  });
  var _invNuevaCategoria = null; // categoría elegida para la inversión que se está por crear

  // ── Lienzo libre — mismo motor (arrastrar, conectar, curvas, redibujo
  // quirúrgico por rAF) que ya se construyó y se probó para el diagrama de
  // Ruta Anual, adaptado aquí para que las conexiones SEAN los requisitos
  // de desbloqueo, no solo decoración. ──
  var INV_W=1100, INV_H=560;
  var INV_NODE=92; // diámetro del círculo
  var INV_SLOT_W=140, INV_SLOT_H=150; // "casilla" que ocupa un nodo (círculo+etiqueta) para el hueco libre

  var _invModo='mover', _invConectarDesde=null, _invDrag=null, _invRAF=null;

  function desbloqueada(inv){
    if(!inv.requiere||!inv.requiere.length) return true;
    return inv.requiere.every(function(rid){
      var req=data.find(function(x){return x.id===rid;});
      return req && req.estado==='Ejecutada';
    });
  }

  function _invBuscarHueco(){
    var pasoX=160, pasoY=150, margen=30;
    for(var y=margen; y<INV_H-INV_SLOT_H; y+=pasoY){
      for(var x=margen; x<INV_W-INV_SLOT_W-margen; x+=pasoX){
        var choca=data.some(function(n){ return Math.abs((n.x||0)-x)<INV_SLOT_W-30 && Math.abs((n.y||0)-y)<INV_SLOT_H-40; });
        if(!choca) return {x:x,y:y};
      }
    }
    var maxY=data.reduce(function(m,n){ return Math.max(m,n.y||0); },0);
    return {x:margen, y:maxY+INV_SLOT_H};
  }

  function _invCurva(x1,y1,x2,y2,seed){
    var mx=(x1+x2)/2, my=(y1+y2)/2;
    var dx=x2-x1, dy=y2-y1;
    var len=Math.sqrt(dx*dx+dy*dy)||1;
    var nx=-dy/len, ny=dx/len;
    var curv=Math.min(55, len*0.25);
    var signo=(seed%2===0)?1:-1;
    var cx=mx+nx*curv*signo, cy=my+ny*curv*signo;
    var pmx=(x1+2*cx+x2)/4, pmy=(y1+2*cy+y2)/4;
    return {cx:cx,cy:cy,pmx:pmx,pmy:pmy};
  }
  function _invHashPar(a,b){
    var s=String(a)+'|'+String(b), h=0;
    for(var i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))|0;
    return Math.abs(h);
  }
  function _invConexionGeo(a,b){
    var cx1=(a.x||0)+INV_NODE/2, cy1=(a.y||0)+INV_NODE/2;
    var cx2=(b.x||0)+INV_NODE/2, cy2=(b.y||0)+INV_NODE/2;
    var dx=cx2-cx1, dy=cy2-cy1, dist=Math.sqrt(dx*dx+dy*dy)||1;
    var ux=dx/dist, uy=dy/dist, r=INV_NODE/2+3;
    var x1=cx1+ux*r, y1=cy1+uy*r, x2=cx2-ux*r, y2=cy2-uy*r;
    var curva=_invCurva(x1,y1,x2,y2,_invHashPar(a.id,b.id));
    return {x1:x1,y1:y1,x2:x2,y2:y2,curva:curva};
  }

  function _invLineasSVG(){
    var svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+INV_W+'" height="'+INV_H+'" viewBox="0 0 '+INV_W+' '+INV_H+'" style="position:absolute;left:0;top:0;pointer-events:none;">';
    svg+='<defs>';
    svg+='<marker id="invArrowOn" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34e07a"/></marker>';
    svg+='<marker id="invArrowOff" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7c6ba8"/></marker>';
    svg+='</defs>';
    data.forEach(function(inv){
      (inv.requiere||[]).forEach(function(rid){
        var a=data.find(function(x){return x.id===rid;});
        var b=inv;
        if(!a) return;
        var cumplido = a.estado==='Ejecutada';
        var geo=_invConexionGeo(a,b);
        var d='M '+geo.x1+','+geo.y1+' Q '+geo.curva.cx+','+geo.curva.cy+' '+geo.x2+','+geo.y2;
        svg+='<g class="inv-conexion" data-from="'+a.id+'" data-to="'+b.id+'">';
        svg+='<path d="'+d+'" fill="none" stroke="'+(cumplido?'#34e07a':'#7c6ba8')+'" stroke-width="'+(cumplido?'2.6':'2')+'" marker-end="url(#'+(cumplido?'invArrowOn':'invArrowOff')+')" opacity="'+(cumplido?'0.85':'0.4')+'" stroke-linecap="round" style="'+(cumplido?'filter:drop-shadow(0 0 3px rgba(52,224,122,0.7));':'')+'"/>';
        svg+='<path d="'+d+'" fill="none" stroke="transparent" stroke-width="18" style="pointer-events:stroke;cursor:pointer;" onclick="window._invConexionBorrarPar(\''+a.id+'\',\''+b.id+'\',event)"><title>Tocar para quitar este requisito</title></path>';
        svg+='<g class="inv-conn-x" style="pointer-events:all;cursor:pointer;opacity:0.3;transition:opacity .15s;" onclick="window._invConexionBorrarPar(\''+a.id+'\',\''+b.id+'\',event)">';
        svg+='<circle cx="'+geo.curva.pmx+'" cy="'+geo.curva.pmy+'" r="8" fill="#1a1233" stroke="'+(cumplido?'#34e07a':'#7c6ba8')+'" stroke-width="1.5"/>';
        svg+='<text x="'+geo.curva.pmx+'" y="'+(geo.curva.pmy+3)+'" text-anchor="middle" font-size="10" fill="#f87171" font-weight="700">✕</text>';
        svg+='</g></g>';
      });
    });
    svg+='</svg>';
    return svg;
  }

  function _invNodoHTML(inv){
    var ok=desbloqueada(inv);
    var col=COLORES[inv.estado]||'#8b93a8';
    var seleccionado=_invConectarDesde===inv.id;
    var glow = inv.estado==='Ejecutada' ? '0 0 18px '+col+'99, 0 0 4px '+col : (ok? '0 0 10px '+col+'44':'none');
    var zona = ZONAS_TALLER.find(function(z){ return z.id===inv.categoria; });
    var h='<div class="inv-nodo" data-id="'+inv.id+'" onpointerdown="window._invDragStart(event,\''+inv.id+'\')" onclick="window._invNodoClick(\''+inv.id+'\')" onmouseenter="window._invTipMostrar(\''+inv.id+'\',event)" onmouseleave="window._invTipOcultar()" ';
    h+='style="position:absolute;left:'+(inv.x||0)+'px;top:'+(inv.y||0)+'px;width:'+INV_SLOT_W+'px;display:flex;flex-direction:column;align-items:center;cursor:'+(_invModo==='mover'?'grab':'pointer')+';touch-action:none;user-select:none;">';

    h+='<div style="width:'+INV_NODE+'px;height:'+INV_NODE+'px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;';
    h+='background:'+(ok?'radial-gradient(circle at 35% 30%, '+col+'40, #1a1233 72%)':'radial-gradient(circle at 35% 30%, #2a2440, #171126 72%)')+';';
    h+='border:2.5px solid '+(seleccionado?'#c084fc':(ok?col:'#4a4368'))+';';
    h+='box-shadow:'+(seleccionado?'0 0 0 4px rgba(192,132,252,0.35), ':'')+glow+';';
    h+='filter:'+(ok?'none':'grayscale(0.55)')+';opacity:'+(ok?'1':'0.65')+';transition:box-shadow .2s;">';
    h+='<span style="font-size:28px;">'+(ok?(inv.estado==='Ejecutada'?'⭐':'🪙'):'🔒')+'</span>';
    if(zona){
      h+='<span title="'+esc(zona.nombre)+'" style="position:absolute;bottom:-3px;right:-3px;width:22px;height:22px;border-radius:50%;background:'+zona.color+';border:2px solid #1a1233;display:flex;align-items:center;justify-content:center;font-size:11px;">'+zona.icon+'</span>';
    }
    h+='</div>';

    h+='<div style="margin-top:6px;font-size:9px;font-weight:700;color:'+(ok?'#f1e9ff':'#867ea8')+';text-align:center;line-height:1.3;overflow-wrap:break-word;word-break:break-word;max-width:'+INV_SLOT_W+'px;">'+esc(inv.nombre)+'</div>';
    h+='<div style="font-size:10px;font-weight:700;color:'+(ok?'#fbbf24':'#6d6690')+';font-family:Space Mono,monospace;">'+fmtM(inv.monto)+'</div>';
    h+='<span style="display:inline-block;margin-top:2px;padding:1px 7px;border-radius:20px;font-size:6.5px;font-weight:700;letter-spacing:0.4px;text-transform:uppercase;background:'+col+'22;border:1px solid '+col+'55;color:'+col+';">'+inv.estado+'</span>';

    h+='<span class="inv-ctrl" style="display:flex;gap:8px;margin-top:3px;opacity:0.35;transition:opacity .15s;">';
    if(inv.estado!=='Ejecutada'){
      h+='<span onclick="event.stopPropagation();window._invEjecutar(\''+inv.id+'\')" title="Marcar como Ejecutada — el punto que desbloquea la siguiente" style="cursor:pointer;font-size:11px;">⭐</span>';
    }
    h+='<span onclick="event.stopPropagation();window._invEditToggle(\''+inv.id+'\')" style="cursor:pointer;font-size:9px;">✎</span>';
    h+='<span onclick="event.stopPropagation();window._invDel(\''+inv.id+'\')" style="cursor:pointer;font-size:9px;color:#f87171;">✕</span>';
    h+='</span>';

    h+='</div>';
    return h;
  }

  function renderLienzo(){
    var h='<style>.inv-nodo:hover .inv-ctrl{opacity:1 !important;} .inv-conn-x:hover{opacity:1 !important;}</style>';
    h+=_invLineasSVG();
    data.forEach(function(inv){ h+=_invNodoHTML(inv); });
    return h;
  }

  function renderArbolLibre(){
    if(!data.length){
      return '<div style="text-align:center;padding:34px 0;color:#a89dd6;font-size:11px;background:radial-gradient(ellipse at center,#231a3d,#150f26);border-radius:16px;">Sin inversiones todavía — agrega la primera abajo para empezar tu árbol</div>';

    h+='<span style="font-size:9px;color:#6B5A73;">'+(_invModo==='mover'?'Arrastra un nodo para acomodar tu árbol':(_invConectarDesde?'Toca la inversión que se desbloquea con esta':'Toca la inversión que hace falta, luego la que desbloquea'))+'</span>';
    h+='</div>';
    h+='<div style="overflow:auto;border-radius:16px;background:radial-gradient(ellipse 80% 60% at 50% 0%,#2c2154 0%,#170f2b 60%,#0d0919 100%);box-shadow:inset 0 0 60px rgba(124,58,237,0.12);padding:16px;">';
    h+='<div id="inv-lienzo" style="position:relative;width:'+INV_W+'px;height:'+INV_H+'px;background-image:radial-gradient(rgba(255,255,255,0.06) 1px,transparent 1px);background-size:26px 26px;">';

  function render(){
    var h='';
    var total=data.reduce(function(s,i){return s+(parseFloat(i.monto)||0);},0);
    var ejecutadas=data.filter(function(i){return i.estado==='Ejecutada';}).reduce(function(s,i){return s+(parseFloat(i.monto)||0);},0);
    h+='<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;">';
    h+='<div style="background:rgba(251,191,36,0.06);border:1px solid rgba(251,191,36,0.15);border-radius:10px;padding:10px;text-align:center;">';
    h+='<div style="font-size:8px;color:#6B5A73;margin-bottom:3px;">Total planeado</div>';
    h+='<div style="font-size:14px;font-weight:700;color:#fbbf24;font-family:Space Mono,monospace;">'+fmtM(total)+'</div></div>';
    h+='<div style="background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.15);border-radius:10px;padding:10px;text-align:center;">';
    h+='<div style="font-size:8px;color:#6B5A73;margin-bottom:3px;">Ejecutado</div>';
    h+='<div style="font-size:14px;font-weight:700;color:#22c55e;font-family:Space Mono,monospace;">'+fmtM(ejecutadas)+'</div></div>';
    h+='<div style="background:rgba(56,189,248,0.06);border:1px solid rgba(56,189,248,0.15);border-radius:10px;padding:10px;text-align:center;">';
    h+='<div style="font-size:8px;color:#6B5A73;margin-bottom:3px;">Inversiones</div>';

  // ── Arrastrar (mismo motor probado en Ruta Anual: mutación directa +
  // redibujo quirúrgico de solo las líneas afectadas, vía rAF) ──
  function _invActualizarLineasDe(nodoId){
    data.forEach(function(inv){
      var tocaEsta = inv.id===nodoId || (inv.requiere||[]).indexOf(nodoId)!==-1;
      if(!tocaEsta) return;
      (inv.requiere||[]).forEach(function(rid){
        if(rid!==nodoId && inv.id!==nodoId) return;
        var a=data.find(function(x){return x.id===rid;});
        if(!a) return;
        var g=document.querySelector('g.inv-conexion[data-from="'+rid+'"][data-to="'+inv.id+'"]');
        if(!g) return;
        var geo=_invConexionGeo(a,inv);
        var d='M '+geo.x1+','+geo.y1+' Q '+geo.curva.cx+','+geo.curva.cy+' '+geo.x2+','+geo.y2;
        var paths=g.querySelectorAll('path');
        if(paths[0]) paths[0].setAttribute('d',d);
        if(paths[1]) paths[1].setAttribute('d',d);
        var circ=g.querySelector('circle'); if(circ){ circ.setAttribute('cx',geo.curva.pmx); circ.setAttribute('cy',geo.curva.pmy); }
        var txt=g.querySelector('text'); if(txt){ txt.setAttribute('x',geo.curva.pmx); txt.setAttribute('y',geo.curva.pmy+3); }
      });
    });
  }

  window._invDragStart=function(ev,id){
    if(_invModo!=='mover') return;
    ev.preventDefault();
    var inv=data.find(function(x){return x.id===id;}); if(!inv) return;
    var wrap=document.getElementById('inv-lienzo');
    var rect=wrap.getBoundingClientRect();
    var scaleX=rect.width>0?INV_W/rect.width:1, scaleY=rect.height>0?INV_H/rect.height:1;
    var px=(ev.clientX-rect.left)*scaleX, py=(ev.clientY-rect.top)*scaleY;
    _invDrag={id:id, offX:px-(inv.x||0), offY:py-(inv.y||0), scaleX:scaleX, scaleY:scaleY, rect:rect};
    document.addEventListener('pointermove', _invDragMove);
    document.addEventListener('pointerup', _invDragEnd);
  };
  function _invDragMove(ev){
    if(!_invDrag) return;
    var inv=data.find(function(x){return x.id===_invDrag.id;}); if(!inv) return;
    var px=(ev.clientX-_invDrag.rect.left)*_invDrag.scaleX, py=(ev.clientY-_invDrag.rect.top)*_invDrag.scaleY;
    var nx=px-_invDrag.offX, ny=py-_invDrag.offY;
    if(isFinite(nx)) inv.x=Math.max(0, Math.min(INV_W-INV_SLOT_W, nx));
    if(isFinite(ny)) inv.y=Math.max(0, Math.min(INV_H-INV_SLOT_H, ny));
    var elNodo=document.querySelector('.inv-nodo[data-id="'+inv.id+'"]');
    if(elNodo){ elNodo.style.left=inv.x+'px'; elNodo.style.top=inv.y+'px'; }
    if(_invRAF) return;
    var raf=window.requestAnimationFrame||function(fn){return setTimeout(fn,16);};
    var idArrastrado=_invDrag.id;
    _invRAF=raf(function(){ _invRAF=null; _invActualizarLineasDe(idArrastrado); });
  }
  function _invDragEnd(){
    document.removeEventListener('pointermove', _invDragMove);
    document.removeEventListener('pointerup', _invDragEnd);
    if(_invDrag){ _invDrag=null; save(); }
  }

  window._invModoSet=function(m){ _invModo=m; _invConectarDesde=null; render(); };

  window._invNodoClick=function(id){
    if(_invModo!=='conectar') return;
    if(!_invConectarDesde){ _invConectarDesde=id; render(); return; }
    if(_invConectarDesde!==id){
      var destino=data.find(function(x){return x.id===id;});
      if(destino){
        if(!destino.requiere) destino.requiere=[];
        if(destino.requiere.indexOf(_invConectarDesde)===-1 && destino.id!==_invConectarDesde){
          destino.requiere.push(_invConectarDesde);
          save();
        }
      }
    }
    _invConectarDesde=null;
    render();
  };

  window._invConexionBorrarPar=function(fromId, toId, ev){
    if(ev) ev.stopPropagation();
    var destino=data.find(function(x){return x.id===toId;}); if(!destino) return;
    destino.requiere=(destino.requiere||[]).filter(function(rid){return rid!==fromId;});
    save(); render();
  };

  // ── Tooltip propio con la descripción — el title nativo del navegador
  // tarda en aparecer y pasa desapercibido, así que se reemplaza por uno
  // fijo (colgado de document.body, mismo truco que el selector de área del
  // widget del Hub) que se ve al instante al pasar el mouse. ──
  window._invTipMostrar=function(id, ev){
    var inv=data.find(function(x){return x.id===id;}); if(!inv) return;
    var texto = inv.nombre + (inv.descripcion ? ' — '+inv.descripcion : '');
    var tip=document.getElementById('inv-tooltip');
    if(!tip){
      tip=document.createElement('div');
      tip.id='inv-tooltip';
      tip.style.cssText='position:fixed;z-index:2100;background:#1a1233;color:#f1e9ff;padding:7px 11px;border-radius:8px;font-size:11px;line-height:1.45;max-width:230px;box-shadow:0 8px 22px rgba(0,0,0,0.4);border:1px solid rgba(168,85,247,0.4);pointer-events:none;';
      document.body.appendChild(tip);
    }
    tip.textContent=texto;
    tip.style.display='block';
    var r=(ev.currentTarget||ev.target).getBoundingClientRect();
    var left=Math.max(8, Math.min((window.innerWidth||900)-238, r.left+r.width/2-115));
    tip.style.left=left+'px';
    tip.style.top=(r.bottom+8)+'px';
  };
  window._invTipOcultar=function(){
    var tip=document.getElementById('inv-tooltip');
    if(tip) tip.style.display='none';
  };

  window._invNuevaCategoriaSet=function(zonaId){
    // El formulario se reconstruye entero al re-renderizar (es innerHTML), así
    // que hay que guardar y devolver lo que la persona ya había escrito para
    // no perderlo solo por tocar una categoría.
    var nombreVal=(document.getElementById('inv-nombre')||{}).value||'';
    var montoVal=(document.getElementById('inv-monto')||{}).value||'';
    var descVal=(document.getElementById('inv-desc')||{}).value||'';
    _invNuevaCategoria = (_invNuevaCategoria===zonaId) ? null : zonaId;
    render();
    var nEl=document.getElementById('inv-nombre'); if(nEl) nEl.value=nombreVal;
    var mEl=document.getElementById('inv-monto'); if(mEl) mEl.value=montoVal;
    var dEl=document.getElementById('inv-desc'); if(dEl) dEl.value=descVal;
  };
  window._invAdd=function(){
    var nombre=(document.getElementById('inv-nombre')||{}).value||'';
    var monto=parseFloat((document.getElementById('inv-monto')||{}).value)||0;
    var desc=(document.getElementById('inv-desc')||{}).value||'';
    if(!nombre||!monto) return;
    var libre=_invBuscarHueco();
    var nueva={id:'inv_'+Date.now(),nombre:nombre,monto:monto,descripcion:desc,estado:'Planeada',requiere:[],x:libre.x,y:libre.y};
    if(_invNuevaCategoria) nueva.categoria=_invNuevaCategoria;
    data.push(nueva);
    _invNuevaCategoria=null;
    save(); render();
  };
  window._invDel=function(id){
    if(!confirm('¿Eliminar esta inversión? También se quitará de lo que dependa de ella.')) return;
    data=data.filter(function(x){return x.id!==id;});
    data.forEach(function(inv){ inv.requiere=(inv.requiere||[]).filter(function(rid){return rid!==id;}); });
    if(_invEditId===id) _invEditId=null;
    save(); render();
  };
  // Sella el momento exacto en que una inversión pasó a Ejecutada. Ese sello es
  // lo que Cosmo_Facturacion.html usa como fecha del gasto y como parte del id
  // del registro derivado — si se deshace la ejecución, se borra el sello (y
  // allá desaparece el gasto); si se vuelve a ejecutar, nace un sello nuevo.
  function _invSellarEjecucion(inv, est){
    if(est==='Ejecutada'){ if(!inv.fechaEjecutada) inv.fechaEjecutada = Date.now(); }
    else if(inv.fechaEjecutada) delete inv.fechaEjecutada;
  }
  window._invEstado=function(id,est){
    var inv=data.find(function(x){return x.id===id;}); if(!inv) return;
    inv.estado=est; _invSellarEjecucion(inv, est); save(); render();
  };
  window._invEjecutar=function(id){
    var inv=data.find(function(x){return x.id===id;}); if(!inv) return;
    inv.estado='Ejecutada'; _invSellarEjecucion(inv, 'Ejecutada'); save(); render();
  };
  window._invSetCategoria=function(id, zonaId){
    var inv=data.find(function(x){return x.id===id;}); if(!inv) return;
    inv.categoria = (inv.categoria===zonaId) ? undefined : zonaId;
    save(); render();
  };
  window._invEditToggle=function(id){
    _invEditId = (_invEditId===id) ? null : id;
    render();
  };
  window._invSaveEdit=function(id){
    var inv=data.find(function(x){return x.id===id;}); if(!inv) return;
    var nEl=document.getElementById('inv-edit-nombre');
    var mEl=document.getElementById('inv-edit-monto');
    var dEl=document.getElementById('inv-edit-desc');
    if(!nEl||!mEl) return;
    var nombre=nEl.value.trim();
    var monto=parseFloat(mEl.value)||0;
    var desc=dEl?dEl.value.trim():'';
    if(!nombre||!monto){ alert('Nombre y monto son obligatorios.'); return; }
    inv.nombre=nombre; inv.monto=monto; inv.descripcion=desc;
    save(); render();
  };

  // Migra inversiones que no tengan posición todavía (de antes del árbol libre)
  var faltaPosicion=false;
  data.forEach(function(inv){ if(inv.x===undefined || inv.y===undefined){ var libre=_invBuscarHueco(); inv.x=libre.x; inv.y=libre.y; faltaPosicion=true; } });
  if(faltaPosicion) save();

  window._invRender=render;
  render();
}

function initTaller(){
  var el=document.getElementById('taller-root'); if(!el) return;
  var asignaciones = tallerAsignNormalizar(tallerAsignacionesLoad());
  var zonaAbierta = null;
  function saveAsignaciones(){ tallerAsignacionesSave(asignaciones); }

  function esAfin(persona, zona){
    return getTop2Areas(persona).some(function(a){
      return zona.afines.some(function(af){ return (a.nombre||'').toLowerCase().indexOf(af)!==-1; });
    });
  }

  function render(){
    // Siempre en fresco: una sincronización externa puede haber cambiado
    // localStorage sin pasar por saveAsignaciones() de aquí.
    asignaciones = tallerAsignNormalizar(tallerAsignacionesLoad());
    var members = teamLoadAll();
    var h = '<div style="font-size:11px;color:var(--muted);line-height:1.7;margin-bottom:14px;">Toca una zona para elegir quién trabaja ahí — una persona puede estar en varias áreas.</div>';

    h += '<div style="display:grid;grid-template-columns:1fr 1fr;grid-template-areas:\'contenido impresion\' \'corte resina\' \'despacho atencion\' \'administracion administracion\';gap:10px;">';

    ZONAS_TALLER.forEach(function(zona){
      var asignados = Object.keys(asignaciones).filter(function(pid){ return (asignaciones[pid]||[]).indexOf(zona.id)!==-1; })
        .map(function(pid){ return members.find(function(m){ return m.id===pid; }); }).filter(Boolean);
      var abierta = zonaAbierta===zona.id;

    var lista = asignaciones[mid] || [];

function initTeam(){
  let members = safeParse(localStorage.getItem('cosmo_team'), null) || _DEFAULT_TEAM.map(function(m){ return Object.assign({},m); });
  const saveT=()=>teamSave(members);
  const ROLE_TAGS = ['CEO','COO','Fundador/a','Producción','Diseño','Ventas','Marketing','Logística','Operaciones','Tiempo completo','Parcial','Freelance','Nuevo'];
  const AREAS = ['Ejecución','Inteligencia','Creatividad','Comunicación','Técnica','Liderazgo'];

  function buildRadar(stats, mi){
    const size = 140, cx = size/2, cy = size/2, r = 48;
    const axes = getAxes(members[mi]||{});
    const AICONS = axes.icons;
    const ACOLORS = axes.colors;
    const n = axes.areas.length;
    function pt(i, val){
      const angle = (Math.PI*2/n)*i - Math.PI/2;
      const rv = r * (val/100);
      return [cx + rv*Math.cos(angle), cy + rv*Math.sin(angle)];
    }
    function ptOuter(i){
      const angle = (Math.PI*2/n)*i - Math.PI/2;
      return [cx + r*Math.cos(angle), cy + r*Math.sin(angle)];
    }
    let bgHexes = '';
    [0.25,0.5,0.75,1].forEach(function(scale){
      const pts = AREAS.map(function(_,i){
        const angle = (Math.PI*2/n)*i - Math.PI/2;
        return (cx+r*scale*Math.cos(angle))+','+(cy+r*scale*Math.sin(angle));
      }).join(' ');
      bgHexes += '<polygon points="'+pts+'" fill="none" stroke="rgba(90,60,100,0.10)" stroke-width="0.5"/>';
    });
    let axisLines = '';
    axes.areas.forEach(function(_,i){
      const op = ptOuter(i);
      axisLines += '<line x1="'+cx+'" y1="'+cy+'" x2="'+op[0]+'" y2="'+op[1]+'" stroke="rgba(90,60,100,0.14)" stroke-width="0.5"/>';
    });
    const statPts = stats.map(function(v,i){ const p=pt(i,v); return p[0]+','+p[1]; }).join(' ');
    const avgStat = stats.reduce(function(a,b){return a+b;},0)/stats.length;
    const fillAlpha = 0.15 + (avgStat/100)*0.25;
    const statPoly = '<polygon points="'+statPts+'" fill="rgba(124,58,237,'+fillAlpha.toFixed(2)+')" stroke="'+ACOLORS[0]+'" stroke-width="1.5"/>';
    let dots = '';
    stats.forEach(function(v,i){
      const p = pt(i,v);
      dots += '<circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.5" fill="'+ACOLORS[i]+'"/>';
    });
    let labels = '';
    axes.areas.forEach(function(name,i){
      const angle = (Math.PI*2/n)*i - Math.PI/2;
      const lx = cx + (r+16)*Math.cos(angle);
      const ly = cy + (r+16)*Math.sin(angle);
      labels += '<text x="'+lx+'" y="'+ly+'" text-anchor="middle" dominant-baseline="middle" fill="'+ACOLORS[i]+'" font-size="6" font-weight="600" font-family="DM Sans,sans-serif">'+AICONS[i]+'</text>';
    });
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 '+size+' '+size+'">'+bgHexes+axisLines+statPoly+dots+labels+'</svg>';
  }

        + '</div></div>'

        + '</div>'

        + '<div style="font-size:8px;text-transform:uppercase;letter-spacing:1px;color:#6B5A73;margin-bottom:2px;">Nota / foco actual</div>'
        + '<div contenteditable="true" onblur="window._updMember('+mi+',\'note\',this.textContent)" style="font-size:10px;color:#f59e0b;font-style:italic;outline:none;">'+m.note+'</div>'
        + '</div></div>';
    });
    root.innerHTML = html;
  }

var _FB = 'https://firestore.googleapis.com/v1/projects/cosmo-98107/databases/(default)/documents/cosmo-hub/';
var _fbPend = {}, _fbT = {}, FB_DEBOUNCE = 900;

function _fbSave(key,value){
  try{
    localStorage.setItem('__ts_'+key, String(Date.now()));
    _fbPend[key] = String(value);
    clearTimeout(_fbT[key]);
    _fbT[key] = setTimeout(function(){ _fbFlushKey(key); }, FB_DEBOUNCE);
  }catch(e){}
}
function _fbFlushKey(key){
  if(!(key in _fbPend)) return;
  var value = _fbPend[key]; delete _fbPend[key];
  clearTimeout(_fbT[key]);
  try{
    var ts = Date.now();
    localStorage.setItem('__ts_'+key, String(ts));
    fetch(_FB+encodeURIComponent(key)+'?updateMask.fieldPaths=data&updateMask.fieldPaths=updatedAt',{
      method:'PATCH',headers:{'Content-Type':'application/json'},keepalive:true,
      body:JSON.stringify({fields:{data:{stringValue:value},updatedAt:{integerValue:String(ts)}}})
    }).then(function(r){
      if(r.ok){
        var flds={}; flds[key]={integerValue:String(ts)};
        fetch(_FB+'__manifest?updateMask.fieldPaths='+encodeURIComponent(key),{method:'PATCH',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({fields:flds})}).catch(function(){});
      }
    }).catch(function(){});
  }catch(e){}
}
function _fbFlushAll(){ Object.keys(_fbPend).forEach(_fbFlushKey); }
window.addEventListener('beforeunload', _fbFlushAll);

var METAS_DEL_KEY = 'cosmo_metas2026_del';
var INV_DEL_KEY = 'cosmo_inversiones_del';
var _EQ_DEL_DIAS = 60;

function _eqParseArr(s){ try{ var v=JSON.parse(s||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }

function _eqMergeTumbas(loc, rem){
  var idx={};
  (loc||[]).concat(rem||[]).forEach(function(t){ if(t&&t.id) idx[t.id]=Math.max(idx[t.id]||0, t.ts||0); });
  var lim = Date.now()-_EQ_DEL_DIAS*86400000;
  var out=Object.keys(idx).filter(function(id){ return idx[id]>lim; }).map(function(id){ return {id:id, ts:idx[id]}; });
  out.sort(function(a,b){ return (b.ts-a.ts) || (a.id<b.id?-1:1); });
  return out;
}

function _eqSellarArr(key, arrNuevo, delKey){
  var prev = {}, prevIds = {};
  _eqParseArr(localStorage.getItem(key)).forEach(function(x){ if(x&&x.id){ prev[x.id]=x; prevIds[x.id]=1; } });
  var ahora = Date.now();
  var canon = function(x){ var c={}; for(var k in x){ if(k!=='_m') c[k]=x[k]; } return JSON.stringify(c); };
  (arrNuevo||[]).forEach(function(x){
    if(!x||!x.id) return;
    var pv = prev[x.id];
    if(!pv){ x._m = ahora; }
    else{
      if(canon(pv)!==canon(x)) x._m = ahora;
      else if(pv._m && !x._m) x._m = pv._m;
      delete prevIds[x.id];
    }
  });
  if(!delKey) return;
  var borrados = Object.keys(prevIds);
  if(!borrados.length) return;

}

function _eqMergeArr(loc, rem, tumbas){
  var idx={};
  (loc||[]).forEach(function(x){ if(x&&x.id) idx[x.id]=x; });
  (rem||[]).forEach(function(x){
    if(!x||!x.id) return;
    var mio=idx[x.id];
    if(!mio){ idx[x.id]=x; return; }
    var a=(mio._m||0), b=(x._m||0);
    if(b>a) idx[x.id]=x;
    else if(b===a && JSON.stringify(x)>JSON.stringify(mio)) idx[x.id]=x;
  });
  var tIdx={};
  (tumbas||[]).forEach(function(t){ if(t&&t.id) tIdx[t.id]=Math.max(tIdx[t.id]||0, t.ts||0); });
  var out=[];
  Object.keys(idx).forEach(function(id){
    if(tIdx[id] && tIdx[id] >= (idx[id]._m||0)) return;
    out.push(idx[id]);
  });
  out.sort(function(a,b){ return String(a.id)<String(b.id)?-1:1; });
  return out;
}

// Una persona puede estar en varias áreas — migra el formato viejo de una
// sola zona (string) al nuevo de varias (array), por si quedó algo del diseño anterior.
function tallerAsignNormalizar(asign){
  var out = {};
  Object.keys(asign||{}).forEach(function(pid){
    var v = asign[pid];
    out[pid] = Array.isArray(v) ? v.slice() : (v ? [v] : []);
  });

var _FB_ARR_MERGE = {};
_FB_ARR_MERGE['cosmo_team'] = TEAM_DEL_KEY;

_FB_ARR_MERGE['cosmo_inversiones'] = INV_DEL_KEY;
_FB_ARR_MERGE['cosmo_missions'] = null;

var _FB_TOMB_KEYS = [TEAM_DEL_KEY, METAS_DEL_KEY, INV_DEL_KEY];
var _FB_KEYS = ['cosmo_team','cosmo_metas2026','cosmo_inversiones','cosmo_missions','cosmo_taller_asignaciones'].concat(_FB_TOMB_KEYS);

var _fbPulling = false, _fbLastPull = 0;
function _fbPull(force, cb){
  if(_fbPulling){ if(cb) cb(); return; }
  if(!force && Date.now()-_fbLastPull<3000){ if(cb) cb(); return; }
  _fbPulling = true; _fbLastPull = Date.now();
  _syncDot('run');
  fetch(_FB+'__manifest')
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(doc){
    if(!doc || !doc.fields){ _syncDot('ok'); return; }
    var jobs = [];
    _FB_KEYS.forEach(function(key){
      var f = doc.fields[key];
      if(!f || !f.integerValue) return;
      var remoto = parseInt(f.integerValue,10)||0;
      var local  = parseInt(localStorage.getItem('__ts_'+key)||'0',10)||0;
      if(remoto > local) jobs.push({key:key, ts:remoto});
    });
    if(!jobs.length){ _syncDot('ok'); return; }
    jobs.sort(function(a,b){ return (_FB_TOMB_KEYS.indexOf(a.key)===-1?1:0)-(_FB_TOMB_KEYS.indexOf(b.key)===-1?1:0); });
    var huboCambios = false;
    var cadena = Promise.resolve();
    jobs.forEach(function(j){
      cadena = cadena.then(function(){
        return fetch(_FB+encodeURIComponent(j.key))
          .then(function(r){ return r.ok ? r.json() : null; })
          .then(function(d){
            var remStr = (d && d.fields && d.fields.data && d.fields.data.stringValue) || '';
            if(!remStr) return;
            var key = j.key;
            if(_FB_TOMB_KEYS.indexOf(key)!==-1){
              var merged = _eqMergeTumbas(_eqParseArr(localStorage.getItem(key)), _eqParseArr(remStr));
              var mergedStr = JSON.stringify(merged);
              if(mergedStr !== localStorage.getItem(key)){ localStorage.setItem(key, mergedStr); huboCambios = true; }
              if(mergedStr !== remStr) _fbSave(key, mergedStr);
              else localStorage.setItem('__ts_'+key, String(j.ts));
            } else if(_FB_ARR_MERGE.hasOwnProperty(key)){
              var delKey = _FB_ARR_MERGE[key];
              var tumbas = delKey ? _eqParseArr(localStorage.getItem(delKey)) : [];
              var loc = _eqParseArr(localStorage.getItem(key));
              var merged2 = _eqMergeArr(loc, _eqParseArr(remStr), tumbas);
              var merged2Str = JSON.stringify(merged2);
              if(merged2Str !== localStorage.getItem(key)){ localStorage.setItem(key, merged2Str); huboCambios = true; }
              if(merged2Str !== remStr) _fbSave(key, merged2Str);
              else localStorage.setItem('__ts_'+key, String(j.ts));
            } else {
              // Adopción simple (cosmo_taller y cualquier otra clave de bajo
              // riesgo de concurrencia que no esté registrada como arreglo)
              if(remStr !== localStorage.getItem(key)){ localStorage.setItem(key, remStr); huboCambios = true; }
              localStorage.setItem('__ts_'+key, String(j.ts));
            }
          }).catch(function(){});
      });
    });
    return cadena.then(function(){
      _syncDot('ok');
      if(!huboCambios) return;
      if(document.getElementById('vista-team').classList.contains('active') && typeof window._teamRender==='function') window._teamRender();
      if(document.getElementById('vista-taller').classList.contains('active') && typeof window._tallerRender==='function') window._tallerRender();
      if(document.getElementById('vista-ruta').classList.contains('active') && typeof window._rutaRender==='function') window._rutaRender();
      if(document.getElementById('vista-inversiones').classList.contains('active') && typeof window._invRender==='function') window._invRender();
      toast('☁️ Datos sincronizados desde otro dispositivo', 2200);
    });
  })
  .catch(function(){ _syncDot(navigator.onLine===false ? 'off' : 'err'); })
  .then(function(){ _fbPulling = false; if(cb) cb(); });
}

var SYNC_MS = 10000;
var _syncTimer = null;
function _syncStart(){
  if(_syncTimer) return;
  _syncTimer = setInterval(function(){ if(document.visibilityState==='visible') _fbPull(); }, SYNC_MS);
}
function _syncStop(){ clearInterval(_syncTimer); _syncTimer = null; }
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState === 'hidden'){ _fbFlushAll(); _syncStop(); }
  else { _fbPull(true); _syncStart(); }
});
window.addEventListener('focus',  function(){ _fbPull(); });
window.addEventListener('online', function(){ _fbPull(true); });
window.addEventListener('offline',function(){ _syncDot('off'); });

function _syncDot(estado){
  var d = document.getElementById('sync-dot');
  if(!d) return;
  d.className = 'sync-dot ' + estado;
  if(estado==='ok')       d.title = '☁️ Sincronizado con tus otros dispositivos · toca para forzar ahora';
  else if(estado==='run') d.title = '☁️ Sincronizando…';
  else if(estado==='off') d.title = 'Sin conexión — los cambios quedan guardados aquí y suben solos al volver internet';
  else                    d.title = 'No se pudo sincronizar · toca para reintentar';
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
initTeam();
initTaller();
initRuta();
initInversiones();
_syncDot(navigator.onLine===false ? 'off' : 'run');
_fbPull(true, function(){
  if(typeof window._teamRender==='function') window._teamRender();
  if(typeof window._tallerRender==='function') window._tallerRender();
  if(typeof window._rutaRender==='function') window._rutaRender();
  if(typeof window._invRender==='function') window._invRender();
});
if(document.visibilityState !== 'hidden') _syncStart();

// ── Abrir en una pestaña concreta desde fuera ────────────────────────────────
// El Hub enlaza a la app YA en la vista que corresponde (por ejemplo Métricas),
// para que el núcleo dé el titular y la app dé la explicación sin que haya que
// navegar a mano. Formato: Cosmo_X.html#vista=metricas
(function(){
  function _irAVistaDeURL(){
    var h = (location.hash||'').replace('#','');
    if(h.indexOf('vista=') !== 0) return;
    var v = h.slice(6).replace(/[^a-z0-9]/gi,'');
    if(!v) return;
    var destino = document.getElementById('vista-'+v);
    if(!destino) return;   // vista desconocida: se ignora en vez de romper
    try{ switchVista(v); }catch(e){}
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', _irAVistaDeURL);
  else _irAVistaDeURL();
  window.addEventListener('hashchange', _irAVistaDeURL);
})();
</script>

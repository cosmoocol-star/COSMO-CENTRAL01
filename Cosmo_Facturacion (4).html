<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#10041a">
<title>💰 COSMO — Facturación</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F2EAF4; --surface:rgba(255,255,255,0.86); --surface2:rgba(120,80,130,0.22);
  --accent:#7c3aed; --accent2:#A872AD;
  --teal:#0e7490; --blue:#6D3F79;
  --gold:#b45309; --green:#15803d; --red:#dc2626;
  --text:#2A1F30; --muted:#6B5A73; --muted2:#9C8BA3;
  --border:rgba(90,60,100,0.10); --border2:rgba(90,60,100,0.16);
  --radius:10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;min-height:100vh;}
header{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:10px 28px;background:rgba(248,242,250,0.92);border-bottom:1px solid rgba(168,114,173,0.30);backdrop-filter:blur(12px);flex-wrap:wrap;gap:8px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:4px;background:linear-gradient(90deg,var(--blue),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.logo-sub{font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;}
#app{max-width:920px;margin:0 auto;padding:24px 24px 60px;}
.page-title{margin-bottom:20px;}
.page-title h1{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;background:linear-gradient(90deg,var(--blue),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.page-title p{font-size:11px;color:var(--muted);margin-top:2px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.card{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:16px 18px;}
.card-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px;}
.card-value{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:1px;color:var(--text);}
.card-value.green{color:var(--green);}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px;flex-wrap:wrap;}
.toolbar h2{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--blue);}
.btn{padding:8px 14px;background:rgba(147,180,240,0.15);border:1px solid rgba(147,180,240,0.4);border-radius:9px;color:var(--blue);font-size:11px;font-weight:600;font-family:'Space Mono',monospace;cursor:pointer;transition:all 0.2s;}
.btn:hover{background:rgba(147,180,240,0.25);}
.btn-sync{background:rgba(6,182,212,0.1);border-color:rgba(6,182,212,0.35);color:var(--teal);}
.mov-list{background:var(--surface);border:1px solid var(--border2);border-radius:14px;overflow:hidden;}
.mov-row{display:grid;grid-template-columns:80px 1fr 90px 110px 24px;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);font-size:12px;}
.mov-row:last-child{border-bottom:none;}
.mov-row.head{background:rgba(120,80,130,0.04);font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted2);padding:8px 16px;}
.mov-fecha{font-family:'Space Mono',monospace;font-size:10px;color:var(--muted);}
.mov-concepto{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mov-cliente{font-size:10px;color:var(--muted);}
.mov-origen{font-size:9px;padding:3px 8px;border-radius:12px;white-space:nowrap;text-align:center;}
.mov-origen.pedido{background:rgba(21,128,61,0.1);color:var(--green);}
.mov-origen.manual{background:rgba(180,83,9,0.1);color:var(--gold);}
.mov-origen.tipo-abono{background:rgba(180,83,9,0.1);color:var(--gold);}
.mov-origen.tipo-saldo_final{background:rgba(14,116,144,0.1);color:var(--teal);}
.mov-origen.tipo-pago_completo{background:rgba(21,128,61,0.1);color:var(--green);}
.mov-origen.tipo-ajuste{background:rgba(220,38,38,0.1);color:var(--red);}
.mov-origen.tipo-envio{background:rgba(220,38,38,0.1);color:var(--red);}
.mov-origen.tipo-manual{background:rgba(109,63,121,0.1);color:var(--blue);}
.mov-monto{font-family:'Space Mono',monospace;font-weight:600;text-align:right;}
.mov-monto.neg{color:var(--red);}
.mov-del{background:none;border:none;color:var(--muted2);cursor:pointer;font-size:14px;}
.mov-del:hover{color:var(--red);}
.empty{text-align:center;padding:40px 0;color:var(--muted2);font-size:11px;}
.modal-overlay{position:fixed;inset:0;z-index:999;background:rgba(60,40,70,0.30);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:rgba(252,248,253,0.99);border:1px solid rgba(168,85,247,0.35);border-radius:16px;padding:22px 20px;width:min(360px,90vw);}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:3px;color:#8b3fb0;margin-bottom:14px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:4px;}
.field input,.field textarea{width:100%;background:#fff;border:1px solid var(--border2);border-radius:8px;padding:8px 10px;color:var(--text);font-size:13px;outline:none;}
.modal-actions{display:flex;gap:8px;margin-top:6px;}
.modal-actions button{flex:1;padding:10px;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid transparent;}
.btn-save{background:rgba(34,197,94,0.15);border-color:rgba(34,197,94,0.5);color:#15803d;}
.btn-cancel{background:rgba(120,80,130,0.046);border-color:rgba(120,80,130,0.115);color:#475569;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2A1F30;color:#fff;padding:10px 18px;border-radius:10px;font-size:12px;z-index:9999;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.25);}
@media(max-width:600px){ .mov-row{grid-template-columns:1fr;gap:4px;} .mov-row.head{display:none;} .mov-row{padding:12px;border-radius:10px;margin-bottom:6px;border:1px solid var(--border2);} }
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">COSMO</div>
    <div class="logo-sub">Facturación</div>
  </div>
</header>

<div id="app">
  <div class="page-title">
    <h1>💰 FACTURACIÓN</h1>
    <p>Movimientos de ingreso — sincronizados automáticamente desde Pedidos</p>
  </div>

  <div class="cards" id="cards-root"></div>

  <div class="toolbar">
    <h2>Movimientos</h2>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-sync" onclick="sincronizarPedidos(true)">↻ Sincronizar</button>
      <button class="btn" onclick="abrirModal()">+ Movimiento manual</button>
    </div>
  </div>

  <div class="mov-list" id="mov-root"></div>
</div>

<div class="modal-overlay" id="mov-modal">
  <div class="modal-box">
    <div class="modal-title">➕ NUEVO MOVIMIENTO</div>
    <div class="field"><label>Concepto</label><input type="text" id="mm-concepto" placeholder="Ej: Venta directa en feria"></div>
    <div class="field"><label>Cliente (opcional)</label><input type="text" id="mm-cliente" placeholder="Nombre del cliente"></div>
    <div class="field"><label>Monto</label><input type="number" id="mm-monto" min="0" placeholder="0"></div>
    <div class="modal-actions">
      <button class="btn-save" onclick="guardarManual()">✓ Guardar</button>
      <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════
// STORAGE
// ══════════════════════════════════════
var MOV_KEY = 'cosmo_facturacion_movs';   // array de movimientos
var REG_KEY = 'cosmo_facturacion_reg';    // {pedidoId: montoYaRegistrado} — evita duplicar

function movLoad(){ try{ return JSON.parse(localStorage.getItem(MOV_KEY)||'[]'); }catch(e){ return []; } }
function movSave(arr){ var s=JSON.stringify(arr); localStorage.setItem(MOV_KEY,s); _fbSave(MOV_KEY,s); }
function regLoad(){ try{ return JSON.parse(localStorage.getItem(REG_KEY)||'{}'); }catch(e){ return {}; } }
function regSave(obj){ var s=JSON.stringify(obj); localStorage.setItem(REG_KEY,s); _fbSave(REG_KEY,s); }
var REG_ENVIO_KEY = 'cosmo_facturacion_reg_envio'; // {pedidoId:true} — evita registrar el gasto de envío 2 veces
function regEnvioLoad(){ try{ return JSON.parse(localStorage.getItem(REG_ENVIO_KEY)||'{}'); }catch(e){ return {}; } }
function regEnvioSave(obj){ var s=JSON.stringify(obj); localStorage.setItem(REG_ENVIO_KEY,s); _fbSave(REG_ENVIO_KEY,s); }
function pedidosLoad(){ try{ return JSON.parse(localStorage.getItem('cosmo_pedidos_v2')||'[]'); }catch(e){ return []; } }

function fmt(n){ return '$'+Math.round(n).toLocaleString('es-CO'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function movId(){ return 'm_'+Date.now()+'_'+Math.random().toString(36).slice(2,6); }

var _toastT;
function toast(msg, ms){
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(_toastT);
  _toastT = setTimeout(function(){ t.style.display='none'; }, ms||3000);
}

// ══════════════════════════════════════
// LÓGICA DE PAGO DEL PEDIDO (misma que Cosmo Pedidos)
// ══════════════════════════════════════
function pagoEstado(p){
  if(p.estadoPago) return p.estadoPago;
  return p.pagado ? 'pagado' : 'sin_pago';
}
function pagoAbonadoReal(p){
  var e = pagoEstado(p);
  if(e === 'pagado')   return p.total || 0;
  if(e === 'sin_pago') return 0;
  return Math.min(Math.max(0, p.abonado || 0), p.total || 0);
}

// ══════════════════════════════════════
// SINCRONIZACIÓN: pedidos → movimientos
// Por cada pedido, compara lo que ya tiene pagado vs. lo que ya
// registramos como movimiento. Si subió, crea un movimiento por la
// diferencia. Si bajó (corrección), crea un ajuste negativo.
// Nunca duplica: siempre trabaja sobre la diferencia (delta).
// ══════════════════════════════════════
function sincronizarPedidos(manual){
  var pedidos = pedidosLoad();
  var reg = regLoad();
  var regEnvio = regEnvioLoad();
  var movs = movLoad();
  var creados = 0;

  pedidos.forEach(function(p){
    var pagadoReal = pagoAbonadoReal(p);
    var yaReg = reg[p.id] || 0;
    var delta = pagadoReal - yaReg;
    var estado = pagoEstado(p);
    var nombreCli = (p.cliente&&p.cliente.nombre) || 'Pedido';

    // ── Envío: "incluido" se cobró (resta del ingreso al pasar a pagado);
    // "gratis" nunca se cobró, así que es gasto puro, sin tocar el ingreso ──
    var envioTipo = p.envio && p.envio.tipo;
    var envioMonto = envioTipo === 'incluido' ? (p.envio.monto || 0)
                    : envioTipo === 'gratis'   ? (p.envio.valor || 0)
                    : 0;
    if(estado === 'pagado' && envioMonto > 0 && !regEnvio[p.id]){
      var envioConcepto = envioTipo === 'gratis'
        ? ('🎁 Envío gratis (costo asumido) — ' + nombreCli)
        : ('🚚 Envío — ' + nombreCli);
      movs.push({
        id: movId(), ts: Date.now(), monto: -envioMonto,
        concepto: envioConcepto, cliente: nombreCli,
        pedidoId: p.id, origen: 'pedido', tipo: 'envio'
      });
      regEnvio[p.id] = true;
      creados++;
      if(envioTipo === 'incluido') delta -= envioMonto; // esa parte del pago ya no es ingreso
      if(Math.abs(delta) < 1){ reg[p.id] = pagadoReal; return; }
    }

    if(Math.abs(delta) < 1){ if(pagadoReal !== yaReg) reg[p.id] = pagadoReal; return; }

    var tipo, concepto;
    if(delta < 0){
      tipo = 'ajuste';
      concepto = 'Ajuste — ' + nombreCli;
    }else if(estado === 'abonado'){
      tipo = 'abono';
      concepto = 'Abono — ' + nombreCli;
    }else if(estado === 'pagado' && yaReg > 0){
      tipo = 'saldo_final';
      concepto = 'Saldo final — ' + nombreCli;
    }else{
      tipo = 'pago_completo';
      concepto = 'Pago completo — ' + nombreCli;
    }

    movs.push({
      id: movId(),
      ts: Date.now(),
      monto: delta,
      concepto: concepto,
      cliente: nombreCli,
      pedidoId: p.id,
      origen: 'pedido',
      tipo: tipo
    });
    reg[p.id] = pagadoReal;
    creados++;
  });

  if(creados > 0){
    movSave(movs);
    regSave(reg);
    regEnvioSave(regEnvio);
  }
  if(manual) toast(creados > 0 ? ('✓ '+creados+' movimiento'+(creados>1?'s':'')+' nuevo'+(creados>1?'s':'')) : 'Ya está todo al día', 2200);
  render();
}

// ══════════════════════════════════════
// MOVIMIENTO MANUAL
// ══════════════════════════════════════
function abrirModal(){
  document.getElementById('mm-concepto').value = '';
  document.getElementById('mm-cliente').value = '';
  document.getElementById('mm-monto').value = '';
  document.getElementById('mov-modal').classList.add('open');
  setTimeout(function(){ document.getElementById('mm-concepto').focus(); }, 50);
}
function cerrarModal(){ document.getElementById('mov-modal').classList.remove('open'); }

function guardarManual(){
  var concepto = document.getElementById('mm-concepto').value.trim();
  var cliente  = document.getElementById('mm-cliente').value.trim();
  var monto    = parseFloat(document.getElementById('mm-monto').value) || 0;
  if(!concepto){ toast('Escribe un concepto', 2000); return; }
  if(monto <= 0){ toast('El monto debe ser mayor a 0', 2000); return; }

  var movs = movLoad();
  movs.push({ id: movId(), ts: Date.now(), monto: monto, concepto: concepto, cliente: cliente, pedidoId: null, origen: 'manual', tipo: 'manual' });
  movSave(movs);
  cerrarModal();
  render();
  toast('✓ Movimiento agregado', 2000);
}

function eliminarMov(id){
  if(!confirm('¿Eliminar este movimiento?')) return;
  var movs = movLoad().filter(function(m){ return m.id !== id; });
  movSave(movs);
  render();
}
window.eliminarMov = eliminarMov;
window.abrirModal = abrirModal;
window.cerrarModal = cerrarModal;
window.guardarManual = guardarManual;
window.sincronizarPedidos = sincronizarPedidos;

// ══════════════════════════════════════
// RENDER
// ══════════════════════════════════════
function render(){
  var movs = movLoad().slice().sort(function(a,b){ return b.ts - a.ts; });

  // Cards resumen
  var totalHist = movs.reduce(function(s,m){ return s+m.monto; }, 0);
  var ahora = new Date();
  var totalMes = movs.filter(function(m){
    var d = new Date(m.ts);
    return d.getMonth()===ahora.getMonth() && d.getFullYear()===ahora.getFullYear();
  }).reduce(function(s,m){ return s+m.monto; }, 0);

  var cardsHtml = ''
    + '<div class="card"><div class="card-label">Total histórico</div><div class="card-value green">'+fmt(totalHist)+'</div></div>'
    + '<div class="card"><div class="card-label">Este mes</div><div class="card-value green">'+fmt(totalMes)+'</div></div>'
    + '<div class="card"><div class="card-label">Movimientos</div><div class="card-value">'+movs.length+'</div></div>';
  document.getElementById('cards-root').innerHTML = cardsHtml;

  // Lista
  var root = document.getElementById('mov-root');
  if(!movs.length){
    root.innerHTML = '<div class="empty">Sin movimientos todavía.<br>Se crean solos cuando un pedido queda Abonado o Pagado.</div>';
    return;
  }
  var TIPO_LABEL = {
    abono:         '◐ Abono',
    saldo_final:   '✓ Saldo final',
    pago_completo: '● Pago completo',
    ajuste:        '⚠ Ajuste',
    envio:         '🚚 Envío',
    manual:        '✍️ Manual'
  };
  var html = '<div class="mov-row head"><div>Fecha</div><div>Concepto</div><div>Cliente</div><div>Tipo</div><div></div></div>';
  movs.forEach(function(m){
    var d = new Date(m.ts);
    var fechaStr = d.toLocaleDateString('es-CO',{day:'2-digit',month:'short'});
    var tipo = m.tipo || (m.origen==='pedido' ? 'pago_completo' : 'manual');
    html += '<div class="mov-row">'
      + '<div class="mov-fecha">'+fechaStr+'</div>'
      + '<div class="mov-concepto" title="'+esc(m.concepto)+'">'+esc(m.concepto)+'<div class="mov-monto'+(m.monto<0?' neg':'')+'" style="text-align:left;font-size:13px;">'+fmt(m.monto)+'</div></div>'
      + '<div class="mov-cliente">'+esc(m.cliente||'—')+'</div>'
      + '<div class="mov-origen tipo-'+tipo+'">'+(TIPO_LABEL[tipo]||tipo)+'</div>'
      + '<button class="mov-del" onclick="eliminarMov(\''+m.id+'\')" title="Eliminar">✕</button>'
      + '</div>';
  });
  root.innerHTML = html;
}

// ══════════════════════════════════════
// FIREBASE SYNC — mismo backend REST que Cosmo Pedidos (proyecto cosmo-98107,
// colección cosmo-hub). Además de sus propias claves, hace PULL (solo lectura)
// de cosmo_pedidos_v2 para poder sincronizar aunque Pedidos no se haya abierto
// en este dispositivo.
// ══════════════════════════════════════
var _FB = 'https://firestore.googleapis.com/v1/projects/cosmo-98107/databases/(default)/documents/cosmo-hub/';
var _fbPend = {}, _fbT = {}, FB_DEBOUNCE = 900;

function _fbSave(key,value){
  try{
    localStorage.setItem('__ts_'+key, String(Date.now()));
    _fbPend[key] = String(value);
    clearTimeout(_fbT[key]);
    _fbT[key] = setTimeout(function(){ _fbFlushKey(key); }, FB_DEBOUNCE);
  }catch(e){}
}
function _fbFlushKey(key){
  if(!(key in _fbPend)) return;
  var value = _fbPend[key]; delete _fbPend[key];
  clearTimeout(_fbT[key]);
  try{
    var ts = Date.now();
    localStorage.setItem('__ts_'+key, String(ts));
    fetch(_FB+encodeURIComponent(key)+'?updateMask.fieldPaths=data&updateMask.fieldPaths=updatedAt',{
      method:'PATCH',headers:{'Content-Type':'application/json'},keepalive:true,
      body:JSON.stringify({fields:{data:{stringValue:value},updatedAt:{integerValue:String(ts)}}})
    }).then(function(r){
      if(r.ok){
        var flds={}; flds[key]={integerValue:String(ts)};
        fetch(_FB+'__manifest?updateMask.fieldPaths='+encodeURIComponent(key),{method:'PATCH',headers:{'Content-Type':'application/json'},keepalive:true,body:JSON.stringify({fields:flds})}).catch(function(){});
      }
    }).catch(function(){});
  }catch(e){}
}
function _fbFlushAll(){ Object.keys(_fbPend).forEach(_fbFlushKey); }
window.addEventListener('beforeunload', _fbFlushAll);
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') _fbFlushAll(); });

// cosmo_pedidos_v2 se pide solo-lectura: nunca lo escribimos, solo lo bajamos.
var _FB_KEYS = [MOV_KEY, REG_KEY, REG_ENVIO_KEY, 'cosmo_pedidos_v2'];

function _fbPull(cb){
  fetch(_FB+'__manifest')
  .then(function(r){ return r.ok ? r.json() : null; })
  .then(function(doc){
    if(!doc || !doc.fields){ if(cb) cb(); return; }
    var jobs = [];
    _FB_KEYS.forEach(function(key){
      var f = doc.fields[key];
      if(!f || !f.integerValue) return;
      var remoto = parseInt(f.integerValue,10)||0;
      var local  = parseInt(localStorage.getItem('__ts_'+key)||'0',10)||0;
      if(remoto > local) jobs.push({key:key, ts:remoto});
    });
    if(!jobs.length){ if(cb) cb(); return; }
    return Promise.all(jobs.map(function(j){
      return fetch(_FB+encodeURIComponent(j.key))
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(d){
          if(!d || !d.fields || !d.fields.data) return false;
          try{
            localStorage.setItem(j.key, d.fields.data.stringValue||'');
            localStorage.setItem('__ts_'+j.key, String(j.ts));
            return true;
          }catch(e){ return false; }
        }).catch(function(){ return false; });
    })).then(function(){ if(cb) cb(); });
  })
  .catch(function(){ if(cb) cb(); });
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
render();
_fbPull(function(){ sincronizarPedidos(false); });
</script>
</body>
</html>

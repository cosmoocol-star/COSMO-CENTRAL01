<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cotizador Cosmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* Layout: igual al Cosmo Generador — cabecera cósmica, armado del producto a la izquierda y la cotización con el total a la derecha */
:root{
  --bg1:#F1EAF9; --bg2:#EAE1F5; --surface:#FFFFFF; --surface2:#F4EFFA; --line:#E7DDF4; --line2:#D8CBEA;
  --ink:#33204A; --muted:#7D6C97; --label-ink:#8A77A8;
  --lav:#8B5CF6; --lav2:#6D28D9; --pink:#F27BB4; --menta:#2FB9A9; --red:#E14A4A;
  --focus:rgba(139,92,246,.55);
  --f-display:"Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --f-ui:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg1:#170613; --bg2:#1d0a22; --surface:#2a1340; --surface2:#341a4c; --line:#432a5e; --line2:#553a72;
  --ink:#F1E9FB; --muted:#BBA8D6; --label-ink:#A893C6; --red:#ff7a7a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg1:#170613; --bg2:#1d0a22; --surface:#2a1340; --surface2:#341a4c; --line:#432a5e; --line2:#553a72;
  --ink:#F1E9FB; --muted:#BBA8D6; --label-ink:#A893C6; --red:#ff7a7a; color-scheme:dark }
*{box-sizing:border-box}
html{background:var(--bg1);min-height:100%}
body{color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;min-height:100vh;
  background:
    radial-gradient(1100px 500px at 85% -80px, rgba(139,92,246,.10), transparent 60%),
    radial-gradient(900px 420px at 8% 0, rgba(242,123,180,.08), transparent 55%),
    linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 48%,var(--bg1) 100%)}
[hidden]{display:none!important}
.page{max-width:1120px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:16px 48px}
.cosmo-header{display:flex;align-items:center;gap:14px;padding:16px 20px;margin-bottom:16px;border-radius:20px;color:#fff;
  background:
    radial-gradient(2px 2px at 12% 30%, rgba(255,255,255,.9), transparent 60%),
    radial-gradient(1.6px 1.6px at 32% 74%, rgba(255,255,255,.55), transparent 60%),
    radial-gradient(2.2px 2.2px at 58% 22%, rgba(255,255,255,.75), transparent 60%),
    radial-gradient(1.4px 1.4px at 76% 66%, rgba(255,255,255,.5), transparent 60%),
    radial-gradient(2px 2px at 92% 34%, rgba(255,255,255,.8), transparent 60%),
    linear-gradient(120deg,#1F0728 0%,#341040 55%,#4A1A56 100%);
  box-shadow:0 10px 26px rgba(46,16,64,.25)}
.cosmo-logo{height:62px;width:auto;flex-shrink:0;display:block;max-width:40%}
.hdr-text{padding-left:14px;border-left:1px solid rgba(255,255,255,.18);min-width:0}
h1{font-family:var(--f-display);font-size:22px;font-weight:400;letter-spacing:.6px;line-height:1.15;margin:0}
.hdr-text .sub{font-size:12px;color:#CBB6E6;margin:3px 0 0}
.app{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(84,49,128,.07);padding:14px}
.slabel{font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--label-ink);margin:0 0 8px;text-transform:uppercase}
.chips + .slabel,.row + .slabel,#presWrap > .slabel,.chips + #presWrap{margin-top:16px}
#presWrap + .slabel{margin-top:16px}
.chips{display:grid;gap:6px}
.chips.prod{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
.chips.sizes{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.chips.pres{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.chips.refs{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
#refWrap + .slabel,.chips + #refWrap{margin-top:16px}
.chip{font:inherit;text-align:center;padding:8px 6px;border-radius:999px;border:1.5px solid var(--line2);background:transparent;color:var(--ink);font-weight:700;font-size:12.5px;cursor:pointer;transition:all .15s;line-height:1.2;font-variant-numeric:tabular-nums}
.chip small{display:block;font-weight:600;font-size:10.5px;color:var(--muted);margin-top:1px}
.chip:hover{border-color:var(--lav);color:var(--lav2)}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--lav),var(--lav2));border-color:transparent;color:#fff}
.chip[aria-pressed="true"] small{color:#E9DDFF}
.chip:focus-visible,button:focus-visible,.stepper input:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.inbox input:focus{outline:none}
.chip.wide{grid-column:1/-1;border-radius:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line2);border-radius:999px;overflow:hidden}
.stepper button{width:38px;height:38px;border:0;background:transparent;color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.stepper button:hover{background:var(--surface2)}
.stepper input{width:56px;height:38px;border:0;text-align:center;font:inherit;font-size:16px;font-weight:700;background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
.pick{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.pick .txt{min-width:0}
.pick .what{font-weight:700}
.pick .det{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
button.cta{font:inherit;font-weight:700;font-size:14px;border-radius:999px;padding:10px 20px;cursor:pointer;border:0;color:#fff;background:linear-gradient(135deg,var(--lav) 0%,#B84FD0 55%,#E14A9F 100%)}
button.cta:hover:not(:disabled){background:linear-gradient(135deg,#7C4DEB 0%,#A63FBF 55%,#D13A90 100%)}
button.cta:disabled{opacity:.4;cursor:not-allowed}
button.ghost{font:inherit;font-weight:700;font-size:12px;border-radius:999px;padding:6px 12px;cursor:pointer;border:1.5px solid var(--line2);background:transparent;color:var(--muted)}
button.ghost:hover{border-color:var(--red);color:var(--red)}
.side{position:sticky;top:calc(env(safe-area-inset-top, 0px) + 12px)}
.items{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:first-child{padding-top:2px}
.item .n{font-weight:700}
.item .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.item .x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;font-size:13px}
.item .x:hover{border-color:var(--red);color:var(--red)}
.empty{border:1.5px dashed var(--line2);border-radius:14px;padding:26px 14px;text-align:center;color:var(--muted);font-size:13px}
.adj{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.field label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.08em;color:var(--label-ink);text-transform:uppercase;margin-bottom:5px}
.inbox{display:flex;align-items:center;border:1.5px solid var(--line2);border-radius:12px;background:var(--surface2);padding:0 10px}
.inbox span{color:var(--muted);font-weight:700;font-size:13px}
.inbox input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;font-weight:700;color:var(--ink);padding:9px 6px;font-variant-numeric:tabular-nums}
.inbox:focus-within{border-color:var(--lav)}
.sum{margin-top:14px;display:flex;flex-direction:column;gap:5px;font-variant-numeric:tabular-nums}
.sum div{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--muted)}
.sum .neg{color:var(--red)}
.total{margin-top:10px;padding:14px 16px;border-radius:16px;color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;
  background:radial-gradient(1.6px 1.6px at 18% 30%, rgba(255,255,255,.8), transparent 60%),radial-gradient(1.4px 1.4px at 80% 70%, rgba(255,255,255,.6), transparent 60%),linear-gradient(120deg,#1F0728 0%,#341040 55%,#4A1A56 100%)}
.total .l{font-family:var(--f-display);font-size:18px;letter-spacing:.4px}
.total .t{font-family:var(--f-display);font-size:30px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.total .p{width:100%;font-size:12px;color:#CBB6E6;margin-top:-2px}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.headrow .slabel{margin:0}
@media (max-width:820px){ .app{grid-template-columns:minmax(0,1fr)} .side{position:static} }
@media (max-width:640px){ .cosmo-header{padding:12px 14px;border-radius:16px} h1{font-size:18px} .cosmo-logo{height:46px} .hdr-text{padding-left:10px} .adj{grid-template-columns:1fr} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html,body{margin:0}img{max-width:100%}</style>
</head>

const unidadTxt = (u, n) => n + " " + (n === 1 ? u[0] : u[1]);

function chip(html, pressed, onClick, extra) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip" + (extra || ""); b.innerHTML = html;
  b.setAttribute("aria-pressed", pressed ? "true" : "false");
  b.addEventListener("click", onClick);
  return b;
}
function nombreItem(P, z) { return P.nombre + (S.ref ? " " + S.ref : "") + " " + z.t + (z.nota ? " (" + z.nota + ")" : ""); }
function detalleOp(o) { return o.unidad[0] === "plancha" ? (o.pares ? o.pares + " pares" : "") : (o.unidad[0] === "docena" ? "12 pares" : ""); }

function renderPicker() {
  const P = CATALOGO[S.prod];
  $("prods").replaceChildren(...Object.entries(CATALOGO).map(([k, p]) => chip(p.nombre, k === S.prod, () => {
    if (k !== S.prod) { S.prod = k; S.size = null; S.ref = null; S.op = 0; $("qty").value = 1; }
    renderPicker();
  })));
  $("refWrap").hidden = !P.refs;
  if (P.refs) $("refs").replaceChildren(...P.refs.map(r => chip(r, r === S.ref, () => { S.ref = S.ref === r ? null : r; renderPicker(); })));
  $("sizes").replaceChildren(...P.tamanos.map((z, i) => {
    const desde = Math.min(...z.op.map(o => o.precio));
    return chip(z.t + "<small>" + (z.op.length > 1 ? "desde " : "") + fmt(desde) + "</small>", i === S.size, () => { S.size = i; S.op = 0; renderPicker(); }, z.wide ? " wide" : "");
  }));
  const z = S.size != null ? P.tamanos[S.size] : null;
  $("presWrap").hidden = !(z && z.op.length > 1);
  if (z && z.op.length > 1) $("pres").replaceChildren(...z.op.map((o, i) => chip(o.label + "<small>" + fmt(o.precio) + " c/u</small>", i === S.op, () => { S.op = i; renderPicker(); })));
  const o = z ? z.op[S.op] : (P.tamanos[0].op[0]);
  $("qtyLabel").textContent = "Cantidad de " + o.unidad[1];
  $("qty").setAttribute("aria-label", "Cantidad de " + o.unidad[1]);
  const q = qty();
  if (z) {
    const det = detalleOp(o);
    $("pickWhat").textContent = nombreItem(P, z);
    $("pickDet").textContent = unidadTxt(o.unidad, q) + (det && o.unidad[0] === "plancha" ? " de " + det : "") + " × " + fmt(o.precio) + " = " + fmt(o.precio * q);
  } else { $("pickWhat").textContent = P.refs ? "Escoge la referencia y el tamaño" : "Escoge un tamaño"; $("pickDet").innerHTML = "&nbsp;"; }
  $("add").disabled = !z;
}
function qty() { const v = Math.floor(+$("qty").value); return v > 0 ? Math.min(v, 9999) : 1; }

function renderQuote() {
  const box = $("items");
  if (!S.items.length) {
    box.innerHTML = '<div class="empty">Agrega productos para ver el total aquí.</div>';
  } else {
    box.replaceChildren(...S.items.map((it, i) => {
      const row = document.createElement("div"); row.className = "item";
      const a = document.createElement("div");
      const n = document.createElement("div"); n.className = "n"; n.textContent = it.nombre;
      const d = document.createElement("div"); d.className = "d";
      d.textContent = unidadTxt(it.unidad, it.cant) + (it.unidad[0] === "plancha" && it.pares ? " · " + it.pares + " pares" : "") + " · " + fmt(it.precio) + " c/u";
      a.append(n, d);
      const v = document.createElement("div"); v.className = "v"; v.textContent = fmt(it.precio * it.cant);
      const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "✕"; x.title = "Quitar"; x.setAttribute("aria-label", "Quitar " + it.nombre);
      x.addEventListener("click", () => { S.items.splice(i, 1); renderQuote(); });
      row.append(a, v, x); return row;
    }));
  }
  $("clear").hidden = !S.items.length;
  const sub = S.items.reduce((s, it) => s + it.precio * it.cant, 0);
  const pct = Math.min(100, Math.max(0, parseFloat(String($("disc").value).replace(",", ".")) || 0));
  const desc = Math.round(sub * pct / 100);
  const envio = parseInt(String($("ship").value).replace(/\D/g, ""), 10) || 0;
  $("sSub").textContent = fmt(sub);
  $("rDisc").hidden = !pct; $("sDiscL").textContent = "Descuento " + (pct % 1 ? pct.toFixed(1) : pct) + "%"; $("sDisc").textContent = "−" + fmt(desc);
  $("rShip").hidden = !envio; $("sShip").textContent = fmt(envio);
  $("sTot").textContent = fmt(sub - desc + envio);
  // resumen: unidades por tipo (planchas, pares, docenas) y total de pares
  const porUnidad = {};
  S.items.forEach(it => { const k = it.unidad[0]; porUnidad[k] = porUnidad[k] || { u: it.unidad, n: 0 }; porUnidad[k].n += it.cant; });
  const partes = ["plancha", "docena", "par"].filter(k => porUnidad[k]).map(k => unidadTxt(porUnidad[k].u, porUnidad[k].n));
  $("sPairs").textContent = S.items.length ? partes.join(" · ") + (envio ? " · envío incluido" : " · sin envío") : "Sin productos todavía";
}

$("add").addEventListener("click", () => {
  const P = CATALOGO[S.prod], z = P.tamanos[S.size]; if (!z) return;
  const o = z.op[S.op], cant = qty(), nombre = nombreItem(P, z);
  const igual = S.items.find(it => it.nombre === nombre && it.unidad[0] === o.unidad[0] && it.pares === o.pares);
  if (igual) igual.cant += cant; else S.items.push({ nombre, unidad: o.unidad, pares: o.pares, precio: o.precio, cant });
  $("qty").value = 1; renderPicker(); renderQuote();
});
$("qMinus").addEventListener("click", () => { $("qty").value = Math.max(1, qty() - 1); renderPicker(); });
$("qPlus").addEventListener("click", () => { $("qty").value = qty() + 1; renderPicker(); });
$("qty").addEventListener("input", renderPicker);
$("qty").addEventListener("blur", () => { $("qty").value = qty(); renderPicker(); });
$("disc").addEventListener("input", renderQuote);
$("ship").addEventListener("input", e => { const d = e.target.value.replace(/\D/g, ""); e.target.value = d ? (+d).toLocaleString("es-CO") : ""; renderQuote(); });
$("clear").addEventListener("click", () => { S.items = []; $("disc").value = ""; $("ship").value = ""; renderQuote(); });

renderPicker(); renderQuote();
</script>
</body>
</html>
